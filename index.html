{d:1,q:"A equipe quer versionar regras de análise, workbooks e playbooks do Sentinel em um repositório do GitHub e implantá-los automaticamente. O que usar?",o:["Repositórios (Repositories) do Microsoft Sentinel","Watchlists","Content hub","Notebooks"],a:[0],e:"Os Repositórios conectam o Sentinel ao GitHub ou ao Azure DevOps e implantam o conteúdo personalizado a partir do código (CI/CD).",c:"Conteúdo como código: revisão, histórico e implantação padronizada entre workspaces.",k:"Microsoft Sentinel repositórios CI/CD"},

/* ===== Lote 3 — Domínio 2 ===== */
{d:2,q:"Você quer bloquear o acesso a sites de categorias como jogos de azar e conteúdo adulto em todos os dispositivos, em qualquer navegador. O que configurar no Defender for Endpoint?",o:["Web content filtering","Safe Links","Regra ASR","Controlled folder access"],a:[0],e:"O web content filtering bloqueia sites por categoria em todos os navegadores. Ele depende da Network Protection.",c:"Proteção web do MDE: proteção contra ameaças web, indicadores personalizados e filtragem por categoria.",k:"Defender for Endpoint web content filtering"},
{d:2,q:"Você quer impedir que aplicativos não confiáveis alterem arquivos nas pastas Documentos e Imagens, como proteção contra ransomware. O que habilitar?",o:["Acesso controlado a pastas (controlled folder access)","Device control","Tamper protection","Isolamento seletivo"],a:[0],e:"O acesso controlado a pastas permite que só aplicativos confiáveis modifiquem as pastas protegidas.",c:"É um recurso de redução da superfície de ataque, com modo de auditoria para testar antes de bloquear.",k:"acesso controlado a pastas Defender"},
{d:2,q:"Você precisa impedir a gravação de dados em pendrives USB, exceto em modelos aprovados pela empresa. O que configurar?",o:["Device control (controle de dispositivos) do Defender for Endpoint","Web content filtering","Uma política anti-spam","Safe Attachments"],a:[0],e:"O device control define políticas de leitura, gravação e execução para mídias removíveis, com exceções por ID de fabricante ou produto e por número de série.",c:"Combine o device control com o Purview DLP quando o objetivo for proteger dados sensíveis.",k:"Defender for Endpoint device control armazenamento removível"},
{d:2,q:"Atacantes enviam e-mails fingindo ser o CEO, usando domínios parecidos e o nome dele. Qual configuração do Defender for Office 365 ajuda mais?",o:["Proteção contra representação de usuário na política anti-phishing, incluindo o CEO","Safe Attachments com entrega dinâmica","Uma regra ASR","Bloquear todos os domínios externos"],a:[0],e:"A proteção contra representação (usuários e domínios) identifica remetentes que imitam pessoas ou domínios protegidos e aplica ações como quarentena.",c:"Spoofing usa o seu domínio exato; impersonation (representação) usa nomes ou domínios parecidos.",k:"Defender for Office 365 proteção contra representação"},
{d:2,q:"Você quer medir quantos funcionários clicam em links de phishing e inscrevê-los automaticamente em treinamento. Qual recurso usar?",o:["Treinamento de simulação de ataque (Attack simulation training)","Threat Explorer","Zero-hour auto purge","Alert tuning"],a:[0],e:"O Attack simulation training (MDO Plano 2) cria campanhas simuladas de phishing, mede os resultados e atribui treinamentos.",c:"Pessoas fazem parte da defesa: simulação, métricas e treinamento contínuo.",k:"Attack simulation training Defender for Office 365"},
{d:2,q:"Você quer descobrir quais apps de nuvem não autorizados (shadow IT) os funcionários usam, sem instalar nada novo nos dispositivos já integrados ao MDE. O que fazer?",o:["Habilitar a integração do Defender for Endpoint com o Cloud Discovery do Defender for Cloud Apps","Criar uma política de sessão","Instalar o sensor do Defender for Identity","Configurar o Safe Links"],a:[0],e:"Com a integração, o MDE envia os dados de tráfego para o Cloud Discovery, que identifica os apps usados. Também é possível enviar logs de firewall ou proxy.",c:"Cloud Discovery = descobrir. Sancionar ou não sancionar = governar. Políticas = controlar.",k:"Defender for Cloud Apps Cloud Discovery integração Defender for Endpoint"},
{d:2,q:"Qual tipo de detecção do Defender for Cloud Apps alerta quando um usuário faz login de dois países distantes em um intervalo impossível de percorrer?",o:["Política de detecção de anomalias (Impossible travel)","Política de sessão","Política de arquivo","Política de acesso"],a:[0],e:"As políticas de detecção de anomalias (como Impossible travel, atividade de país incomum e downloads em massa) vêm prontas e usam perfis de comportamento.",c:"As anomalias precisam de um período de aprendizado para formar a linha de base de cada usuário.",k:"Defender for Cloud Apps detecção de anomalias viagem impossível"},
{d:2,q:"Você quer gerar alertas no Sentinel sempre que os logs tiverem indicadores conhecidos da inteligência de ameaças da própria Microsoft, sem escrever consultas. O que habilitar?",o:["A regra de análise Microsoft Defender Threat Intelligence Analytics","Uma watchlist com IPs","Um search job diário","Um notebook"],a:[0],e:"Essa regra pronta compara os logs (CEF, DNS, Syslog etc.) com os indicadores da Microsoft e gera alertas de alta fidelidade.",c:"Também existem regras de correspondência para os seus próprios indicadores (TI map).",k:"Microsoft Sentinel threat intelligence analytics regra"},
{d:2,q:"Qual é o período máximo de consulta (lookback) de uma regra de análise agendada no Sentinel?",o:["14 dias","24 horas","90 dias","1 ano"],a:[0],e:"A regra agendada consulta no máximo 14 dias de dados, e a frequência pode ir de 5 minutos a 14 dias.",c:"Para padrões mais longos, use hunting, search jobs ou tabelas resumidas.",k:"Microsoft Sentinel regra agendada período de consulta"},
{d:2,q:"Você quer que o título do alerta de uma regra agendada mostre o nome do usuário envolvido, por exemplo \"Login suspeito de ana@empresa.com\". O que configurar?",o:["Personalização dos detalhes do alerta (alert details) com o parâmetro <code>{{UserPrincipalName}}</code>","Uma watchlist","O agrupamento de eventos","Uma regra de automação que renomeia o incidente"],a:[0],e:"Nos detalhes do alerta, o formato do nome e da descrição aceita colunas do resultado entre chaves duplas, gerando títulos dinâmicos.",c:"Também dá para sobrescrever severidade, táticas e técnicas com valores vindos da consulta.",k:"Microsoft Sentinel personalizar detalhes do alerta"},
{d:2,q:"Usuários enviam arquivos para uma conta de armazenamento por um portal público. Você quer verificar cada blob enviado em busca de malware. O que habilitar?",o:["Defender for Storage com verificação de malware no upload","Defender for Key Vault","Defender CSPM","Safe Attachments"],a:[0],e:"A verificação de malware do Defender for Storage analisa os blobs no momento do upload e pode acionar automações, como mover o arquivo para quarentena.",c:"O Defender for Storage também detecta acessos anômalos e exfiltração de dados.",k:"Defender for Storage verificação de malware"},
{d:2,q:"Você quer avaliar vulnerabilidades das imagens no Azure Container Registry e detectar ameaças em tempo de execução no AKS. Qual plano habilitar?",o:["Defender for Containers","Defender for Servers","Defender for App Service","Defender for Storage"],a:[0],e:"O Defender for Containers cobre a avaliação de vulnerabilidades de imagens, a postura do Kubernetes e a proteção em tempo de execução dos clusters.",c:"Cadeia de contêiner: registro (imagens), cluster (postura) e execução (runtime).",k:"Defender for Containers"},
{d:2,q:"Um atacante usa uma conta comum para pedir a replicação do AD e obter os hashes de senha de todos os usuários. Qual alerta do Defender for Identity indica isso?",o:["Suspected DCSync attack (replication of directory services)","Suspected brute-force attack (LDAP)","Impossible travel","Mass download"],a:[0],e:"O DCSync imita um controlador de domínio pedindo replicação. O MDI alerta quando essa solicitação vem de uma máquina que não é DC.",c:"Outros alertas clássicos do MDI: pass-the-hash, pass-the-ticket, Kerberoasting, Golden Ticket, reconhecimento por LDAP e SMB.",k:"Defender for Identity DCSync alerta"},
{d:2,q:"Você quer exigir MFA apenas quando um login for considerado de risco médio ou alto pelo Entra ID Protection. O que configurar?",o:["Uma política de Conditional Access com a condição de risco de entrada (sign-in risk)","Uma política de risco de usuário que bloqueia sempre","Security defaults","Uma regra ASR"],a:[0],e:"A condição de sign-in risk no Conditional Access permite exigir MFA nos logins arriscados. O risco de usuário trata credenciais comprometidas e costuma exigir troca de senha.",c:"Sign-in risk = este login é suspeito. User risk = esta conta provavelmente está comprometida.",k:"Conditional Access risco de entrada MFA"},

/* ===== Lote 3 — Domínio 3 ===== */
{d:3,q:"Depois de investigar, você conclui que o incidente foi causado por um teste de intrusão autorizado. Qual classificação usar no Defender XDR?",o:["Atividade informativa e esperada (Informational, expected activity)","Verdadeiro positivo","Falso positivo","Não definido"],a:[0],e:"Testes autorizados e atividades legítimas que dispararam detecções corretamente são \"informativa e esperada\". Falso positivo é quando a detecção estava errada.",c:"Classificar bem melhora as detecções e as métricas do SOC.",k:"Defender XDR classificar incidentes"},
{d:3,q:"Durante a análise, você percebe que um alerta de outro incidente faz parte do mesmo ataque. O que fazer no portal do Defender?",o:["Vincular o alerta ao incidente atual (Link alert to another incident)","Excluir o outro incidente","Criar uma regra de automação","Reclassificar como falso positivo"],a:[0],e:"O Defender correlaciona alertas automaticamente, mas você pode mover ou vincular um alerta a outro incidente manualmente.",c:"Um incidente deve representar um ataque inteiro, para dar a visão completa da cadeia.",k:"Defender XDR vincular alerta a incidente"},
{d:3,q:"No Sentinel, você quer explorar visualmente as entidades de um incidente e expandir para alertas e atividades relacionados. O que usar?",o:["O gráfico de investigação (investigation graph)","Um workbook","Content hub","Watchlists"],a:[0],e:"O gráfico de investigação mostra as entidades mapeadas e permite expandir consultas de exploração para ver alertas e atividades relacionados.",c:"Sem mapeamento de entidades, o gráfico fica vazio.",k:"Microsoft Sentinel gráfico de investigação"},
{d:3,q:"Você quer ver, em uma página só, a linha do tempo, os alertas e os insights de comportamento de um usuário envolvido em vários incidentes. O que abrir?",o:["A página da entidade (entity page) do usuário","O Content hub","A página de conectores de dados","O Secure Score"],a:[0],e:"A página da entidade reúne os alertas, a linha do tempo de atividades e os insights do UEBA sobre aquela conta, host ou IP.",c:"Comece pela entidade quando a pergunta for \"o que mais essa conta ou máquina fez?\".",k:"Microsoft Sentinel páginas de entidade"},
{d:3,q:"Você quer executar um arquivo suspeito em um ambiente isolado na nuvem e obter um relatório de comportamento (processos, rede, registro). Qual recurso usar?",o:["Análise profunda (deep analysis) do arquivo no Defender for Endpoint","Collect investigation package","Run antivirus scan","Restringir execução de aplicativos"],a:[0],e:"A deep analysis detona o arquivo em sandbox e gera um relatório com os comportamentos observados.",c:"Na página do arquivo também aparecem a prevalência global e na organização, e os dispositivos onde ele foi visto.",k:"Defender for Endpoint análise profunda de arquivo"},
{d:3,q:"Você quer executar um script PowerShell próprio, não assinado, em uma sessão de live response. O que é necessário? <b>(Escolha duas)</b>",o:["Fazer o upload do script para a biblioteca do live response","Habilitar o recurso avançado de execução de scripts não assinados no live response","Isolar o dispositivo antes","Instalar o Azure Monitor Agent"],a:[0,1],e:"O comando <code>run</code> só executa scripts da biblioteca. Scripts sem assinatura exigem o recurso avançado específico habilitado.",c:"Live response tem dois níveis: básico (leitura, coleta) e avançado (upload, run, remediação).",k:"Defender for Endpoint live response executar script"},
{d:3,q:"Um e-mail claramente malicioso não foi detectado pelo Defender for Office 365. Como informar à Microsoft para melhorar a detecção?",o:["Enviar a mensagem pela página Envios (Submissions) do portal do Defender","Abrir um alerta no Sentinel","Criar uma regra ASR","Usar o live response"],a:[0],e:"A página Envios permite enviar e-mails, URLs e anexos à Microsoft como falsos negativos ou falsos positivos. Também dá para criar entradas de bloqueio na Tenant Allow/Block List.",c:"O botão de reportar mensagem no Outlook também alimenta a página Envios.",k:"Defender for Office 365 envios submissions"},
{d:3,q:"Você quer que, quando um usuário reportar um e-mail como phishing, uma investigação automática encontre e sugira remover as mensagens semelhantes. Qual recurso faz isso?",o:["Investigação e resposta automatizadas (AIR) do Defender for Office 365 Plano 2","Safe Links","Mail flow rule","Content hub"],a:[0],e:"A AIR do MDO P2 é disparada por e-mails reportados e por alertas, busca mensagens semelhantes e propõe ações (como soft delete), que aparecem no Action center.",c:"Mesmo modelo de aprovação da AIR do Defender for Endpoint: as ações pendentes ficam no Action center.",k:"Defender for Office 365 investigação automatizada AIR"},
{d:3,q:"Um app OAuth malicioso recebeu consentimento de usuários para ler e-mails (Mail.Read). Qual é a ação mais efetiva para cortar o acesso dele?",o:["Desabilitar ou banir o app no Defender for Cloud Apps (app governance) e revogar as permissões concedidas","Redefinir a senha dos usuários e nada mais","Isolar os notebooks dos usuários","Bloquear o domínio do remetente no Exchange"],a:[0],e:"Tokens OAuth continuam válidos mesmo após a troca de senha. É preciso desabilitar o app e revogar o consentimento. O app governance e o Entra ID permitem fazer isso.",c:"Ataques de consentimento ilícito exploram permissões concedidas, não senhas.",k:"app governance desabilitar app OAuth"},
{d:3,q:"A senha de um usuário comprometido foi redefinida, mas o atacante ainda tem sessões abertas. O que fazer em seguida no Entra ID?",o:["Revogar as sessões do usuário (Revoke sessions)","Desabilitar o MFA","Remover a licença do Microsoft 365","Excluir o dispositivo do Intune"],a:[0],e:"Revogar as sessões invalida os tokens de atualização, forçando um novo login em todos os apps.",c:"Contenção de conta: redefinir a senha, revogar sessões, revisar métodos de MFA e regras de caixa de correio.",k:"Entra ID revogar sessões do usuário"},
{d:3,q:"Você quer executar um playbook manualmente sobre um endereço IP, a partir da página da entidade ou do gráfico de investigação. Qual gatilho o playbook deve usar?",o:["Gatilho de entidade (Microsoft Sentinel entity)","Gatilho de incidente","Gatilho de alerta","Gatilho de recorrência"],a:[0],e:"Playbooks com gatilho de entidade podem ser executados sob demanda sobre uma entidade específica (IP, conta, host, URL…).",c:"Gatilhos do Sentinel para Logic Apps: incidente, alerta e entidade.",k:"Microsoft Sentinel playbook gatilho de entidade"},
{d:3,q:"Durante um incidente, qual recurso do Security Copilot no portal do Defender sugere as próximas ações de triagem, contenção e remediação?",o:["Guided response (resposta guiada)","Script analysis","Secure Score","Threat analytics"],a:[0],e:"A resposta guiada recomenda ações com base no incidente, como isolar o dispositivo ou classificar o incidente, e permite executá-las direto da sugestão.",c:"Copilot no Defender: resumo do incidente, resposta guiada, análise de script e arquivo, KQL em linguagem natural e relatório do incidente.",k:"Security Copilot resposta guiada Defender"},
{d:3,q:"Você precisa ver tudo o que aconteceu em um dispositivo (processos, conexões, arquivos, registro) nos minutos antes e depois de um alerta. Onde ver isso?",o:["Na linha do tempo do dispositivo (device timeline) no Defender for Endpoint","No Secure Score","Em Envios","No Content hub"],a:[0],e:"A linha do tempo do dispositivo mostra os eventos em ordem cronológica, com filtros e a opção de marcar eventos e ver a árvore de processos.",c:"A árvore de processos (quem iniciou quem) costuma revelar a cadeia do ataque.",k:"Defender for Endpoint linha do tempo do dispositivo"},

/* ===== Lote 3 — Domínio 4 ===== */
{d:4,q:"Você quer procurar o texto \"mimikatz\" em <b>todas</b> as tabelas do workspace, sem saber onde ele aparece. Qual operador usar?",o:["<code>search</code>","<code>where</code>","<code>project</code>","<code>join</code>"],a:[0],e:"<code>search \"mimikatz\"</code> procura em todas as tabelas e colunas. É útil para explorar, mas é caro: depois de descobrir a tabela, troque por <code>where</code>.",c:"search = exploração ampla; where = filtro preciso e eficiente.",k:"KQL operador search"},
{d:4,q:"Em uma consulta longa, você quer definir uma vez a lista de IPs suspeitos e reutilizá-la em várias partes. Qual instrução usar?",o:["<code>let</code>","<code>extend</code>","<code>print</code>","<code>render</code>"],a:[0],e:"<code>let</code> cria variáveis, listas ou subconsultas reutilizáveis, como <code>let IPs = dynamic([\"1.2.3.4\",\"5.6.7.8\"]);</code>.",c:"Toda instrução let termina com ponto e vírgula, e a consulta principal vem depois.",k:"KQL instrução let"},
{d:4,q:"Você quer detectar picos incomuns de logins por usuário ao longo de 14 dias, usando uma função de detecção de anomalias em séries temporais. Qual combinação usar?",o:["<code>make-series</code> + <code>series_decompose_anomalies()</code>","<code>summarize</code> + <code>take</code>","<code>join</code> + <code>union</code>","<code>parse_json</code> + <code>mv-expand</code>"],a:[0],e:"<code>make-series</code> cria a série com intervalos regulares (preenchendo zeros) e <code>series_decompose_anomalies()</code> marca os pontos fora do padrão.",c:"Séries temporais em KQL: make-series, series_decompose_anomalies, series_fit_line, render timechart.",k:"KQL make-series series_decompose_anomalies"},
{d:4,q:"Você quer listar os eventos de regras ASR em modo auditoria no advanced hunting. Qual tabela e filtro usar?",o:["<code>DeviceEvents</code> com <code>ActionType startswith \"Asr\"</code>","<code>DeviceProcessEvents</code> com <code>FileName == \"asr.exe\"</code>","<code>AlertInfo</code> com <code>Title has \"ASR\"</code>","<code>DeviceInfo</code> com <code>OSPlatform == \"ASR\"</code>"],a:[0],e:"Os eventos das regras ASR (auditados e bloqueados) ficam em <code>DeviceEvents</code>, com ActionType como <code>AsrOfficeChildProcessAudited</code>.",c:"DeviceEvents guarda eventos diversos: ASR, detecções de antivírus, Exploit Protection, eventos de USB e outros.",k:"advanced hunting DeviceEvents ASR ActionType"},
{d:4,q:"Você quer listar os alertas dos últimos 7 dias junto com os dispositivos e arquivos envolvidos em cada um. Quais tabelas combinar?",o:["<code>AlertInfo</code> e <code>AlertEvidence</code>, unidas por <code>AlertId</code>","<code>EmailEvents</code> e <code>DeviceInfo</code>","<code>SigninLogs</code> e <code>AuditLogs</code>","<code>Heartbeat</code> e <code>Usage</code>"],a:[0],e:"<code>AlertInfo</code> tem os dados do alerta (título, severidade, fonte) e <code>AlertEvidence</code> tem as entidades envolvidas (dispositivos, arquivos, contas, IPs).",c:"Um alerta tem várias evidências: join de 1 para muitos.",k:"advanced hunting AlertInfo AlertEvidence"},
{d:4,q:"Você quer enriquecer resultados do advanced hunting com a prevalência global, o assinante e a reputação de arquivos pelo hash. Qual função usar?",o:["<code>FileProfile()</code>","<code>DeviceFromIP()</code>","<code>parse_json()</code>","<code>geo_info_from_ip_address()</code>"],a:[0],e:"<code>FileProfile()</code> recebe SHA1 ou SHA256 e acrescenta colunas como GlobalPrevalence, Signer, IsCertificateValid e ThreatName.",c:"Arquivos com prevalência global muito baixa costumam merecer investigação.",k:"advanced hunting FileProfile função"},
{d:4,q:"Por quanto tempo os dados ficam disponíveis no advanced hunting do Defender XDR (sem Sentinel)?",o:["30 dias","7 dias","180 dias","2 anos"],a:[0],e:"O advanced hunting mantém até 30 dias de dados brutos. Para guardar por mais tempo, envie as tabelas para o Sentinel ou para um workspace.",c:"Retenção longa e correlação com fontes de terceiros = Sentinel.",k:"advanced hunting retenção de dados 30 dias"},
{d:4,q:"Durante o hunting, você quer ver informações de um domínio suspeito, como WHOIS, histórico de DNS passivo, certificados e artigos de inteligência relacionados. O que usar?",o:["Microsoft Defender Threat Intelligence (perfis de host e intel)","Secure Score","Device timeline","Action center"],a:[0],e:"A threat intelligence da Microsoft no portal do Defender oferece dados de infraestrutura (WHOIS, DNS passivo, certificados) e perfis de atores e ferramentas.",c:"Pivotar pela infraestrutura do atacante revela outros domínios e IPs relacionados.",k:"Microsoft Defender Threat Intelligence"},

/* ===== Lote 3 — Telas simuladas ===== */
{d:4,scr:{cap:"Advanced hunting · consulta e resultado",html:`<div class="kql">DeviceInfo
| where Timestamp > ago(1d)
| summarize arg_max(Timestamp, *) by DeviceId
| project DeviceName, OSPlatform, PublicIP</div>
<table><tr><th>DeviceName</th><th>OSPlatform</th><th>PublicIP</th></tr><tr><td>nb-fin-017</td><td>Windows11</td><td>198.51.100.10</td></tr><tr><td>srv-app-01</td><td>WindowsServer2022</td><td>198.51.100.11</td></tr><tr><td>mac-design-03</td><td>macOS</td><td>198.51.100.10</td></tr></table>`},
 q:"Por que a consulta da tela usa <code>arg_max(Timestamp, *)</code>?",o:["Para retornar só o registro mais recente de cada dispositivo, com todas as colunas","Para somar os horários","Para retornar o dispositivo com o maior número de eventos","Para ordenar os resultados por nome"],a:[0],
 e:"A tabela DeviceInfo recebe vários registros por dispositivo. <code>arg_max(Timestamp, *) by DeviceId</code> mantém, para cada DeviceId, a linha com o maior Timestamp e todas as suas colunas.",
 c:"arg_max/arg_min = a linha inteira do valor máximo ou mínimo por grupo. É o padrão para pegar o \"estado atual\".",k:"KQL arg_max"},

{d:3,scr:{cap:"Portal do Defender · Incidente 4182 · Alertas",html:`<table><tr><th>Hora</th><th>Fonte</th><th>Alerta</th><th>Entidade</th></tr>
<tr><td>08:02</td><td>Defender for Office 365</td><td>E-mail com anexo malicioso entregue</td><td>ana@luminavarejo.example</td></tr>
<tr><td>08:15</td><td>Defender for Endpoint</td><td>Documento do Office iniciou processo suspeito</td><td>nb-fin-017</td></tr>
<tr><td>08:31</td><td>Defender for Endpoint</td><td>Acesso suspeito à memória do LSASS</td><td>nb-fin-017</td></tr>
<tr><td>08:47</td><td>Defender for Identity</td><td>Suspeita de pass-the-hash</td><td>srv-file-01</td></tr></table>`},
 q:"Com base nos alertas do incidente, qual foi o vetor de acesso inicial?",o:["E-mail de phishing com anexo malicioso","Pass-the-hash contra srv-file-01","Força bruta em RDP","Exploração de vulnerabilidade no servidor de arquivos"],a:[0],
 e:"Em ordem: e-mail com anexo (acesso inicial) → documento iniciando processo (execução) → acesso ao LSASS (roubo de credenciais) → pass-the-hash (movimento lateral). O primeiro passo é o e-mail.",
 c:"Ler um incidente multiestágio é montar a cadeia: acesso inicial, execução, credenciais, movimento lateral e objetivo.",k:"Defender XDR incidentes multiestágio"},

{d:3,scr:{cap:"Defender for Endpoint · nb-fin-017 · Linha do tempo",html:`<table><tr><th>Hora</th><th>Evento</th></tr>
<tr><td>10:01:12</td><td>winword.exe criou o processo powershell.exe -enc SQBFAFgA…</td></tr>
<tr><td>10:01:15</td><td>powershell.exe conectou-se a 198.51.100.23:443</td></tr>
<tr><td>10:02:40</td><td>powershell.exe criou o arquivo C:\\Users\\Public\\svc.exe</td></tr>
<tr><td>10:03:05</td><td>schtasks.exe /create /tn "Atualizador" /tr C:\\Users\\Public\\svc.exe /sc onlogon</td></tr></table>`},
 q:"Qual evento da linha do tempo representa a técnica de <b>persistência</b>?",o:["A criação da tarefa agendada com schtasks.exe para rodar no logon","O winword.exe criando o powershell.exe","A conexão com 198.51.100.23:443","A criação do arquivo svc.exe"],a:[0],
 e:"Uma tarefa agendada que executa o malware a cada logon garante que ele volte após reinicializações: é persistência (MITRE T1053.005). Os outros eventos são execução, comando e controle e download do payload.",
 c:"Locais comuns de persistência: tarefas agendadas, chaves Run do registro, serviços e a pasta Inicializar.",k:"MITRE ATT&CK persistência tarefa agendada"},

{d:1,scr:{cap:"Defender for Cloud · Recomendação",html:`<div class="sgrid"><span>Recomendação</span><span><b>As portas de gerenciamento das máquinas virtuais devem ser protegidas com controle de acesso de rede just-in-time</b></span><span>Severidade</span><span><span class="sbadge r">Alta</span></span><span>Recursos afetados</span><span>vm-web-01, vm-web-02, vm-app-03</span><span>Portas abertas</span><span>3389 (RDP), 22 (SSH) para 0.0.0.0/0</span></div>`},
 q:"Qual é a forma recomendada de corrigir a recomendação mostrada na tela, mantendo o acesso administrativo quando necessário?",o:["Habilitar o acesso JIT às VMs, que mantém as portas fechadas e as abre sob demanda","Isolar as VMs no Defender for Endpoint","Excluir as VMs","Criar uma regra ASR"],a:[0],
 e:"O JIT altera o NSG para negar as portas por padrão e abre temporariamente só para o IP de quem pediu, com registro de auditoria.",
 c:"Portas de gerenciamento abertas para a internet estão entre os vetores mais explorados em nuvem.",k:"Defender for Cloud just-in-time VM"},

{d:3,scr:{cap:"Microsoft Entra ID Protection · Usuários arriscados",html:`<table><tr><th>Usuário</th><th>Nível de risco</th><th>Estado do risco</th><th>Detecção</th></tr>
<tr><td>joao@tecnova.example</td><td><span class="sbadge r">Alto</span></td><td>Em risco</td><td>Credenciais vazadas</td></tr></table>`},
 q:"Você quer que usuários na situação da tela corrijam o próprio risco automaticamente. Qual política configurar?",o:["Conditional Access com risco de usuário Alto → exigir alteração de senha (com MFA)","Conditional Access com risco de entrada Baixo → bloquear","Bloquear todos os logins fora do Brasil","Desabilitar o MFA para o usuário"],a:[0],
 e:"Credenciais vazadas aumentam o risco do usuário. A remediação recomendada é exigir troca segura de senha (o usuário faz MFA e troca a senha), o que encerra o risco.",
 c:"User risk → trocar a senha. Sign-in risk → exigir MFA.",k:"Conditional Access política de risco de usuário"},

{d:2,scr:{cap:"Defender for Cloud Apps · Cloud Discovery · Apps descobertos",html:`<table><tr><th>App</th><th>Pontuação de risco</th><th>Usuários</th><th>Upload</th><th>Status</th></tr>
<tr><td>ShareFast</td><td><span class="sbadge r">3/10</span></td><td>214</td><td>12,4 GB</td><td><span class="sbadge n">Nenhum</span></td></tr>
<tr><td>Microsoft OneDrive</td><td><span class="sbadge g">10/10</span></td><td>1.870</td><td>310 GB</td><td><span class="sbadge g">Sancionado</span></td></tr></table>`},
 q:"Você quer impedir o acesso ao app ShareFast nos dispositivos integrados ao Defender for Endpoint. O que fazer?",o:["Marcar o ShareFast como Não sancionado, com a integração do Defender for Endpoint habilitada","Marcar o OneDrive como Não sancionado","Criar uma regra ASR","Excluir o app da lista"],a:[0],
 e:"Com a integração ativa, apps marcados como não sancionados viram indicadores de bloqueio no MDE, e a Network Protection impede o acesso nos dispositivos.",
 c:"Fluxo de shadow IT: descobrir → avaliar o risco → sancionar ou não sancionar → bloquear ou monitorar.",k:"Defender for Cloud Apps bloquear app não sancionado"},

{d:2,scr:{cap:"Microsoft Sentinel · Regra de análise · Mapeamento de entidades",html:`<table><tr><th>Tipo de entidade</th><th>Identificador</th><th>Coluna da consulta</th></tr>
<tr><td>Account</td><td>FullName</td><td>UserPrincipalName</td></tr>
<tr><td>IP</td><td>Address</td><td>IPAddress</td></tr>
<tr><td>Host</td><td>HostName</td><td><span class="sbadge n">(não mapeado)</span></td></tr></table>
<div class="note">A consulta retorna as colunas: TimeGenerated, UserPrincipalName, IPAddress, Computer.</div>`},
 q:"Os incidentes dessa regra mostram o usuário e o IP no gráfico de investigação, mas nunca a máquina. Como corrigir?",o:["Mapear a entidade Host usando a coluna Computer","Aumentar a frequência da regra","Habilitar o agrupamento de alertas","Adicionar a regra a uma watchlist"],a:[0],
 e:"Só aparecem no incidente as entidades mapeadas. A consulta já retorna a coluna <code>Computer</code>; basta mapeá-la ao identificador HostName da entidade Host.",
 c:"Entidades não mapeadas não são correlacionadas, não aparecem no gráfico e não podem ser usadas em automações.",k:"Microsoft Sentinel mapeamento de entidades Host"},

<table><tr><th>RecipientEmailAddress</th><th>ThreatTypes</th><th>DeliveryAction</th></tr>
<tr><td>ana@lumina.example</td><td>Phish</td><td>Delivered</td></tr><tr><td>bruno@lumina.example</td><td>Phish</td><td>Delivered</td></tr><tr><td>carla@lumina.example</td><td>Phish</td><td>Delivered</td></tr><tr><td>diego@lumina.example</td><td>Phish</td><td>Delivered</td></tr></table>
