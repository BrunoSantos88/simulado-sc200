<!doctype html><html lang="pt-BR"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Treino SC-200</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: console de SOC — barra fixa de status no topo, um cartão de questão por vez, grade de navegação abaixo */
:root {
  --bg: #f3f6f7; --surface: #ffffff; --sunk: #e8eef0; --line: #cfdadd;
  --fg: #142126; --muted: #536a71; --accent: #0d6a74; --accent-ink: #ffffff; --accent-soft: #d6ecee;
  --ok: #17803d; --ok-soft: #dcf2e3; --bad: #b42318; --bad-soft: #fbe3e0; --warn: #a15c00; --warn-soft: #fbedd5;
  --f-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1517; --surface: #152022; --sunk: #1b292c; --line: #2b3d41;
  --fg: #e3eef0; --muted: #94adb3; --accent: #4fc0cb; --accent-ink: #062a2e; --accent-soft: #163a3e;
  --ok: #5fd08a; --ok-soft: #12321f; --bad: #ff8a7a; --bad-soft: #3a1714; --warn: #f2b45c; --warn-soft: #36270f;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1517; --surface: #152022; --sunk: #1b292c; --line: #2b3d41;
  --fg: #e3eef0; --muted: #94adb3; --accent: #4fc0cb; --accent-ink: #062a2e; --accent-soft: #163a3e;
  --ok: #5fd08a; --ok-soft: #12321f; --bad: #ff8a7a; --bad-soft: #3a1714; --warn: #f2b45c; --warn-soft: #36270f;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
code, pre { font-family: var(--f-mono); font-size: 0.86em; }
code { background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 9px 16px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }

/* Barra superior */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .in { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
.stat { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.timer { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: 999px; background: var(--sunk); }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.progress { height: 4px; background: var(--sunk); }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

/* Início */
.hero { padding-block: 28px 8px; }
.hero h1 { font-size: clamp(28px, 6vw, 40px); letter-spacing: -.02em; }
.hero p { color: var(--muted); max-width: 62ch; margin: 8px 0 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin-top: 18px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.mode { border: 2px solid var(--line); border-radius: var(--r); padding: 14px; text-align: left; background: var(--surface); color: var(--fg); }
.mode[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.mode b { font-family: var(--f-display); font-size: 17px; display: block; }
.mode small { color: var(--muted); font-size: 14px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.check { display: flex; gap: 8px; align-items: center; }
.domains { display: grid; gap: 8px; margin-top: 10px; }
.dom { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; font-size: 15px; }
.dom .tag { font-family: var(--f-mono); font-size: 12px; font-weight: 600; text-align: center; padding: 2px 0; border-radius: 6px; background: var(--sunk); }
.meter { height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; width: 120px; max-width: 30vw; }
.meter i { display: block; height: 100%; background: var(--accent); }
table.hist { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.hist th, table.hist td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.hist th { color: var(--muted); font-weight: 600; }
.tbl { overflow-x: auto; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.note { color: var(--muted); font-size: 14px; }

/* Questão */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; margin-top: 18px; }
.qmeta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.qtext { font-size: 17px; }
.qhint { font-size: 14px; color: var(--warn); font-weight: 600; margin-top: 6px; }
.opts { display: grid; gap: 8px; margin-top: 14px; }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--accent); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .key { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 13px; background: var(--sunk); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .key { background: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: var(--surface); }
.opt.locked { cursor: default; }
.opt.elim { opacity: .4; text-decoration: line-through; }
.hintbox { margin-top: 16px; padding: 12px 14px; border: 1.5px dashed var(--warn); border-radius: 8px; background: var(--warn-soft); }
.hintbox p { margin: 4px 0 0; }
.opt .body { min-width: 0; }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

.verdict { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-weight: 700; font-family: var(--f-display); }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.learn { margin-top: 12px; display: grid; gap: 12px; }
.learn section { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; }
.learn h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
.learn p { margin: 0; max-width: 70ch; }

/* Tutor */
.tutor { margin-top: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk); padding: 14px; }
.tutor h3 { font-size: 16px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.chip:hover { border-color: var(--accent); }
.msgs { display: grid; gap: 8px; margin-top: 10px; }
.msg { padding: 9px 12px; border-radius: 8px; white-space: pre-wrap; max-width: 100%; overflow-wrap: anywhere; }
.msg.me { background: var(--accent-soft); justify-self: end; max-width: 85%; }
.msg.ai { background: var(--surface); border: 1px solid var(--line); }
.msg.err { color: var(--bad); background: var(--bad-soft); }
.ask { display: flex; gap: 8px; margin-top: 10px; }
.ask textarea { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); resize: vertical; min-height: 44px; }

.nav { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin-top: 18px; }
.cell { height: 36px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-family: var(--f-mono); font-size: 13px; position: relative; }
.cell.ans { background: var(--accent-soft); border-color: var(--accent); }
.cell.cur { outline: 2px solid var(--fg); outline-offset: 1px; }
.cell.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.cell.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.cell.mk::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }

/* Resultado */
.score { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.big { font-family: var(--f-display); font-size: 56px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 20px; color: var(--muted); font-weight: 600; }
.review { margin-top: 12px; display: grid; gap: 10px; }
details.rv { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
details.rv summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
details.rv summary .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.confirm { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); }

/* Telas simuladas */
.screen { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 14px; background: var(--surface); }
.screen .cap { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); padding: 5px 10px; background: var(--sunk); border-bottom: 1px solid var(--line); }
.screen .cap b { color: var(--fg); font-weight: 600; }
.scr { padding: 12px; font-size: 14px; overflow-x: auto; display: grid; gap: 10px; }
.scr table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.scr th, .scr td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; white-space: nowrap; }
.scr th { color: var(--muted); font-weight: 600; background: var(--sunk); }
.scr .kql { font-family: var(--f-mono); font-size: 13px; background: var(--sunk); border-radius: 6px; padding: 8px 10px; white-space: pre; overflow-x: auto; }
.sgrid { display: grid; grid-template-columns: minmax(130px, auto) 1fr; gap: 4px 14px; font-size: 14px; }
.sgrid span:nth-child(odd) { color: var(--muted); }
.sbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.sbtn { border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: 13px; background: var(--surface); }
.sbadge { display: inline-block; border-radius: 4px; padding: 0 7px; font-size: 12px; font-weight: 700; }
.sbadge.r { background: var(--bad-soft); color: var(--bad); }
.sbadge.g { background: var(--ok-soft); color: var(--ok); }
.sbadge.y { background: var(--warn-soft); color: var(--warn); }
.sbadge.n { background: var(--sunk); color: var(--muted); }

/* Estudo de caso */
details.case { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); padding: 10px 14px; }
details.case summary { cursor: pointer; font-weight: 700; font-family: var(--f-display); }
details.case .cbody { margin-top: 8px; font-size: 15px; display: grid; gap: 8px; }
details.case .cbody p, details.case .cbody ul { margin: 0; }
details.case .cbody ul { padding-left: 20px; }

/* Sim / Não */
.yn { width: 100%; border-collapse: collapse; margin-top: 14px; }
.yn td, .yn th { border-bottom: 1px solid var(--line); padding: 8px; vertical-align: middle; }
.yn th { font-size: 13px; color: var(--muted); text-align: center; }
.yn th:first-child { text-align: left; }
.yn td.c { text-align: center; width: 64px; }
.yn input { width: 18px; height: 18px; accent-color: var(--accent); }
.yn tr.right td:first-child { box-shadow: inset 3px 0 var(--ok); }
.yn tr.wrong td:first-child { box-shadow: inset 3px 0 var(--bad); }
.mark { font-family: var(--f-mono); font-weight: 700; font-size: 13px; }
.mark.ok { color: var(--ok); } .mark.bad { color: var(--bad); }

/* Hotspot */
.hot { margin-top: 14px; line-height: 2.1; }
.hot pre { line-height: 2; }
select.hs { width: auto; max-width: 100%; display: inline-block; padding: 2px 6px; font-family: var(--f-mono); font-size: 13px; border: 1.5px solid var(--accent); background: var(--accent-soft); }
.hsv { display: inline-block; padding: 0 6px; border-radius: 5px; font-family: var(--f-mono); font-size: 13px; line-height: 1.6; }
.hsv.ok { background: var(--ok-soft); color: var(--ok); }
.hsv.bad { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }

/* Arrastar e soltar */
.dd { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; margin-top: 14px; }
.dd h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pool { display: grid; gap: 6px; align-content: start; min-height: 60px; padding: 8px; border: 1px dashed var(--line); border-radius: 8px; }
.dchip { border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 7px; padding: 7px 10px; text-align: left; cursor: grab; font-size: 15px; }
.dchip.picked { border-color: var(--accent); background: var(--accent-soft); }
.slots { display: grid; gap: 8px; }
.slot { display: grid; gap: 4px; }
.slot .lbl { font-size: 14px; font-weight: 600; }
.drop { min-height: 40px; border: 1.5px dashed var(--line); border-radius: 7px; padding: 6px 10px; background: var(--sunk); color: var(--muted); text-align: left; font-size: 15px; width: 100%; }
.drop.has { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.drop.over { border-color: var(--accent); }
.drop.ok { border-style: solid; border-color: var(--ok); background: var(--ok-soft); color: var(--fg); }
.drop.bad { border-style: solid; border-color: var(--bad); background: var(--bad-soft); color: var(--fg); }
.drop .fix { display: block; font-size: 13px; color: var(--ok); font-weight: 600; }
@media (max-width: 600px) { .dd { grid-template-columns: 1fr; } }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 520px) { .qcard { padding: 14px; } .qtext { font-size: 16px; } .big { font-size: 44px; } }
</style>

<header class="bar">
  <div class="in">
    <div class="brand">SC-200 <span>Treino</span></div>
    <div class="spacer"></div>
    <div class="stat" id="barStat"></div>
    <div class="timer" id="timer" hidden></div>
  </div>
  <div class="progress"><i id="prog" style="width:0"></i></div>
</header>

<main class="wrap" id="app"></main>

<script>
const DOM = {
  1: "Gerenciar o ambiente de operações de segurança",
  2: "Configurar proteções e detecções",
  3: "Gerenciar a resposta a incidentes",
  4: "Gerenciar ameaças (hunting e KQL)"
};

// d = domínio, q = enunciado, o = alternativas, a = índices corretos, e = por que, c = conceito-chave, k = termo para busca no Microsoft Learn
const Q = [
{d:1,q:"Um analista do SOC precisa atribuir, alterar o status e fechar incidentes no Microsoft Sentinel, mas <b>não</b> deve conseguir criar ou editar regras de análise. Seguindo o menor privilégio, qual função atribuir?",o:["Microsoft Sentinel Reader","Microsoft Sentinel Responder","Microsoft Sentinel Contributor","Microsoft Sentinel Automation Contributor"],a:[1],e:"O Responder gerencia incidentes (atribuir, mudar status, fechar). Reader só lê; Contributor também cria e edita regras e conteúdo; Automation Contributor é para a conta de serviço do Sentinel executar playbooks.",c:"As funções do Sentinel crescem em camadas: Reader (ver) → Responder (ver + gerenciar incidentes) → Contributor (tudo isso + criar conteúdo).",k:"Microsoft Sentinel funções permissões"},
{d:1,q:"Sua empresa quer investigar incidentes do Microsoft Sentinel e do Microsoft Defender XDR em uma única fila de incidentes. Onde isso é feito?",o:["No portal do Azure, em Log Analytics","No portal do Microsoft Defender (plataforma unificada de operações de segurança)","No portal do Microsoft Purview","No centro de administração do Microsoft Entra"],a:[1],e:"Ao conectar o workspace do Sentinel ao portal do Defender, os incidentes do Sentinel e do XDR passam a ser correlacionados e exibidos na mesma fila.",c:"A plataforma unificada de SecOps junta SIEM (Sentinel) e XDR (Defender) em um só portal: security.microsoft.com.",k:"Microsoft Sentinel portal do Defender plataforma unificada"},
{d:1,q:"Você configurou o conector <i>Windows Security Events via AMA</i>. Qual objeto define <b>quais eventos</b> são coletados dos servidores e para qual workspace vão?",o:["Uma regra de coleta de dados (Data Collection Rule — DCR)","Uma GPO de auditoria","Um workbook do Sentinel","Uma regra de automação"],a:[0],e:"Com o Azure Monitor Agent, a DCR define as fontes e os filtros (eventos coletados, inclusive por XPath) e o destino (workspace). As outras opções não controlam a coleta do agente.",c:"AMA + DCR é o modelo atual de coleta. O agente legado (MMA/Log Analytics agent) foi descontinuado.",k:"Data Collection Rule Azure Monitor Agent Sentinel"},
{d:1,q:"Um firewall de terceiros só envia logs no formato <b>CEF</b> via Syslog. Qual é a abordagem recomendada para ingerir esses logs no Sentinel?",o:["Instalar o agente do Defender for Endpoint no firewall","Usar o conector <i>Common Event Format (CEF) via AMA</i> com um encaminhador Linux que executa o Azure Monitor Agent","Usar o conector <i>Windows Forwarded Events</i>","Exportar os logs para um Storage Account e usar o conector do Azure Storage"],a:[1],e:"Appliances não aceitam agentes. Eles enviam Syslog/CEF para um encaminhador Linux com AMA, e o conector \"CEF via AMA\" grava os dados na tabela CommonSecurityLog.",c:"CEF e Syslog chegam por um encaminhador Linux. CEF vai para CommonSecurityLog; Syslog puro vai para a tabela Syslog.",k:"CEF via AMA Microsoft Sentinel"},
{d:1,q:"Você precisa ingerir logs de depuração de alto volume, consultados raramente, com o <b>menor custo</b> possível. Qual plano de tabela usar?",o:["Analytics","Basic","Commitment tier de 100 GB/dia","Cluster dedicado"],a:[1],e:"O plano Basic tem ingestão mais barata, com KQL limitado e retenção interativa curta. Commitment tier e cluster dedicado são formas de desconto por volume, não planos de tabela.",c:"Planos de tabela: Analytics (completo, usado por regras de detecção) e Basic/Auxiliary (barato, para logs volumosos e pouco consultados).",k:"Log Analytics planos de tabela Basic logs"},
{d:1,q:"Você quer que todas as novas VMs do Azure de uma assinatura sejam integradas automaticamente ao Microsoft Defender for Endpoint. O que fazer?",o:["Criar uma GPO com o pacote de integração","Habilitar o plano Defender for Servers no Microsoft Defender for Cloud","Instalar o Microsoft Monitoring Agent manualmente em cada VM","Criar uma regra de análise no Sentinel"],a:[1],e:"O Defender for Servers inclui a integração com o MDE e implanta o sensor automaticamente nas máquinas cobertas pela assinatura.",c:"Defender for Cloud protege cargas de nuvem; para servidores, ele usa o próprio Defender for Endpoint como sensor.",k:"Defender for Servers integração Defender for Endpoint"},
{d:1,q:"A equipe de suporte do Brasil deve ver e agir <b>somente</b> sobre os dispositivos do Brasil no Defender for Endpoint. O que configurar?",o:["Uma unidade administrativa no Entra ID","Um grupo de dispositivos associado a uma função personalizada (RBAC)","Uma tag de alerta","Uma política de Conditional Access"],a:[1],e:"No MDE, os grupos de dispositivos definem quais equipes (grupos do Entra associados a funções) enxergam quais máquinas. Também definem o nível de automação.",c:"Device groups = escopo de acesso e de automação no Defender for Endpoint.",k:"Defender for Endpoint grupos de dispositivos RBAC"},
{d:1,q:"Para servidores críticos, <b>qualquer</b> remediação automática da investigação automatizada (AIR) deve ser aprovada por um analista. Qual nível de automação aplicar ao grupo desses servidores?",o:["Full — remediate threats automatically","Semi — require approval for any remediation","Semi — require approval for non-temp folders remediation","No automated response"],a:[1],e:"\"Semi — require approval for any remediation\" exige aprovação para todas as ações. As demais opções \"Semi\" só exigem para algumas pastas; \"No automated response\" desliga a AIR.",c:"A AIR investiga sozinha. O nível de automação define se ela remedia sozinha (Full) ou se espera aprovação no Action center (Semi).",k:"Defender for Endpoint níveis de automação investigação automatizada"},
{d:1,q:"Você precisa detectar ameaças como injeção de SQL e acessos anômalos nos bancos Azure SQL Database. O que habilitar?",o:["O plano Defender for Databases (Azure SQL) no Defender for Cloud","O Defender for Storage","O conector Azure Activity no Sentinel","O Defender for App Service"],a:[0],e:"O plano para Azure SQL (dentro do Defender for Databases) gera alertas de injeção de SQL, acessos de locais incomuns e força bruta.",c:"Cada tipo de recurso tem seu plano no Defender for Cloud: Servers, Storage, Databases, Containers, App Service, Key Vault etc.",k:"Defender for Azure SQL alertas"},
{d:1,q:"Sua organização também usa AWS. Como fazer o Defender for Cloud avaliar a postura e proteger recursos da AWS?",o:["Instalar o Defender for Cloud Apps na AWS","Adicionar um conector AWS em <i>Environment settings</i> no Defender for Cloud","Criar um workspace do Log Analytics na região da AWS","Não é suportado"],a:[1],e:"O Defender for Cloud é multicloud. Os conectores para AWS e GCP ficam em Environment settings.",c:"CSPM (postura) + CWP (proteção de cargas) para Azure, AWS e GCP no mesmo painel.",k:"Defender for Cloud conectar AWS"},
{d:1,q:"Você quer bloquear um IP malicioso em todos os dispositivos usando indicadores do Defender for Endpoint. Quais pré-requisitos são necessários? <b>(Escolha duas)</b>",o:["Habilitar o recurso avançado <i>Custom network indicators</i>","Habilitar a proteção de rede (network protection) no modo bloqueio","Habilitar o modo de auditoria das regras ASR","Habilitar o Defender for Cloud Apps"],a:[0,1],e:"Indicadores de IP, URL e domínio dependem do recurso avançado \"Custom network indicators\" e da Network Protection em modo bloqueio. As outras opções não são necessárias.",c:"Indicadores de arquivo (hash) e de certificado não dependem da Network Protection; os de rede dependem.",k:"Defender for Endpoint indicadores IP URL"},
{d:1,q:"Antes de aplicar regras de redução da superfície de ataque (ASR) em produção, você quer medir o impacto sem bloquear nada. Qual modo usar?",o:["Block","Warn","Audit","Disabled"],a:[2],e:"O modo Audit registra o que seria bloqueado, sem bloquear. Warn bloqueia, mas deixa o usuário prosseguir.",c:"Boa prática: Audit → analisar eventos → exclusões → Block.",k:"regras de redução da superfície de ataque modo auditoria"},
{d:1,q:"Você quer instalar de uma vez o conector, as regras de análise, os workbooks e as consultas de hunting de um produto de terceiros no Sentinel. Onde fazer isso?",o:["Content hub","Threat intelligence","Watchlists","Notebooks"],a:[0],e:"As soluções do Content hub empacotam conectores, regras, workbooks, consultas de hunting e playbooks.",c:"Content hub = loja de soluções do Sentinel (da Microsoft e da comunidade).",k:"Microsoft Sentinel Content hub soluções"},
{d:1,q:"Você criou uma watchlist com o alias <code>VIPUsers</code>. Como referenciá-la em KQL?",o:["<code>Watchlist(\"VIPUsers\")</code>","<code>_GetWatchlist('VIPUsers')</code>","<code>externaldata(VIPUsers)</code>","<code>lookup VIPUsers</code>"],a:[1],e:"<code>_GetWatchlist('alias')</code> retorna os itens da watchlist como tabela, com a coluna <code>SearchKey</code> para joins rápidos.",c:"Watchlists guardam listas de referência (VIPs, IPs permitidos, ativos críticos) para enriquecer regras e hunting.",k:"Microsoft Sentinel watchlists _GetWatchlist"},
{d:1,q:"Um alerta do Defender XDR é gerado repetidamente por uma ferramenta administrativa legítima. Você quer ocultar esses alertas benignos automaticamente, só nessa condição específica. O que usar?",o:["Alert tuning (regra de ajuste de alertas)","Excluir o dispositivo do Defender for Endpoint","Desabilitar a detecção no Defender Antivirus","Classificar manualmente cada alerta como falso positivo"],a:[0],e:"Alert tuning (antes chamado de regras de supressão) oculta ou resolve automaticamente os alertas que atendem às condições definidas, sem desligar a proteção.",c:"Reduzir ruído sem perder visibilidade: ajuste fino com condições, e não exclusões amplas.",k:"Defender XDR alert tuning"},

{d:2,q:"Você precisa de uma regra de análise no Sentinel que gere alertas com o <b>menor atraso possível</b> (execução a cada minuto). Que tipo de regra criar?",o:["Scheduled","Near-real-time (NRT)","Anomaly","Microsoft Security"],a:[1],e:"Regras NRT rodam a cada minuto, com latência mínima. As Scheduled têm intervalo mínimo de 5 minutos.",c:"Tipos de regra: Scheduled, NRT, Fusion, Anomaly (ML), Microsoft Security (cria incidentes de alertas de outros produtos) e Threat Intelligence.",k:"Microsoft Sentinel regras NRT"},
{d:2,q:"Por que configurar o <b>mapeamento de entidades</b> (contas, hosts, IPs) em uma regra de análise agendada?",o:["Para reduzir o custo de ingestão","Para permitir correlação, enriquecimento (UEBA) e o gráfico de investigação","Para a regra rodar mais rápido","Para exportar o alerta para o Defender for Cloud"],a:[1],e:"Entidades mapeadas permitem correlacionar alertas e incidentes, enriquecer com UEBA e navegar pelo gráfico de investigação.",c:"Sem entidades, o alerta é só texto. Com elas, o Sentinel entende quem e o quê está envolvido.",k:"Microsoft Sentinel mapeamento de entidades"},
{d:2,q:"Qual mecanismo do Sentinel usa machine learning para correlacionar alertas de baixa fidelidade e detectar <b>ataques em vários estágios</b>?",o:["Fusion (Advanced multistage attack detection)","Regras NRT","Watchlists","ASIM"],a:[0],e:"O Fusion correlaciona sinais de vários produtos com ML para identificar cadeias de ataque.",c:"Fusion vem habilitado por padrão e não precisa de KQL.",k:"Microsoft Sentinel Fusion detecção multiestágio"},
{d:2,q:"Você habilitou o conector do Defender XDR no Sentinel com sincronização de incidentes. O que é recomendado fazer com as regras <i>Microsoft Security</i> (criação de incidentes) desses produtos?",o:["Mantê-las ativas para redundância","Desativá-las, para evitar incidentes duplicados","Convertê-las em regras NRT","Aumentar a severidade delas"],a:[1],e:"Com a integração de incidentes do XDR, a Microsoft recomenda desativar essas regras. Senão, o mesmo alerta gera dois incidentes.",c:"O conector Defender XDR traz incidentes já correlacionados, sincronizados nos dois sentidos.",k:"conector Microsoft Defender XDR Sentinel incidentes"},
{d:2,q:"Você está criando uma regra de detecção personalizada a partir do advanced hunting do Defender XDR. Quais colunas a consulta precisa retornar?",o:["Somente <code>Timestamp</code>","<code>Timestamp</code>, <code>ReportId</code> e uma coluna identificadora de entidade, como <code>DeviceId</code>","<code>TimeGenerated</code> e <code>Computer</code>","Qualquer coluna, desde que haja um <code>summarize</code>"],a:[1],e:"Detecções personalizadas exigem <code>Timestamp</code>, <code>ReportId</code> e ao menos uma coluna de entidade (DeviceId, AccountObjectId, RecipientEmailAddress…) para gerar o alerta e permitir ações.",c:"Custom detections = consultas KQL agendadas no XDR, que geram alertas e podem disparar ações automáticas.",k:"Defender XDR detecções personalizadas colunas obrigatórias"},
{d:2,q:"Uma regra agendada gera dezenas de alertas por hora para o mesmo usuário, e cada um vira um incidente separado. Como reduzir o volume de incidentes sem perder os alertas?",o:["Desativar a regra","Habilitar o agrupamento de alertas (alert grouping) na configuração de incidentes da regra","Aumentar o período de lookback","Mudar a severidade para Informational"],a:[1],e:"O alert grouping junta alertas relacionados (por exemplo, pelas mesmas entidades) em um incidente, dentro de uma janela de tempo.",c:"Alertas ≠ incidentes: o incidente é o agrupamento que o analista trabalha.",k:"Microsoft Sentinel agrupamento de alertas regra"},
{d:2,q:"Você quer uma única consulta de detecção que funcione para logs de rede de vários fornecedores de firewall. O que usar?",o:["Parsers ASIM, como <code>_Im_NetworkSession</code>","Uma watchlist por fornecedor","A função <code>externaldata</code>","Um workbook"],a:[0],e:"O ASIM normaliza dados de fontes diferentes em um esquema comum; os parsers <code>_Im_*</code> permitem consultas independentes do fornecedor.",c:"ASIM = Advanced Security Information Model: esquemas de Network Session, DNS, Authentication, Process Event etc.",k:"ASIM Advanced Security Information Model"},
{d:2,q:"Um parceiro compartilha indicadores de ameaça por meio de um servidor <b>TAXII 2.x</b>. Como ingeri-los no Sentinel?",o:["Conector Threat Intelligence — TAXII","Conector Syslog","Watchlist com upload manual diário","Conector Azure Activity"],a:[0],e:"O conector TAXII consome coleções STIX/TAXII 2.x e grava os indicadores nas tabelas de threat intelligence.",c:"STIX é o formato do indicador; TAXII é o protocolo de transporte.",k:"Microsoft Sentinel conector TAXII"},
{d:2,q:"Sempre que o Defender for Cloud gerar um alerta de severidade alta, você quer acionar um Logic App que abre um chamado no ServiceNow. O que configurar?",o:["Workflow automation","Continuous export","Regulatory compliance","Secure score"],a:[0],e:"Workflow automation aciona Logic Apps a partir de alertas, recomendações ou mudanças de conformidade. Continuous export só envia os dados para outro destino.",c:"No Defender for Cloud: automação = Logic App; exportação = Event Hub ou Log Analytics.",k:"Defender for Cloud workflow automation"},
{d:2,q:"Usuários em dispositivos não gerenciados podem acessar o SharePoint Online, mas não devem conseguir <b>baixar</b> arquivos. O que configurar?",o:["Uma política de sessão do Defender for Cloud Apps com Conditional Access App Control","Uma regra ASR","Uma política anti-phishing","Um indicador de URL no Defender for Endpoint"],a:[0],e:"O Conditional Access App Control encaminha a sessão pelo Defender for Cloud Apps, e uma política de sessão bloqueia o download em tempo real.",c:"Defender for Cloud Apps = CASB: descoberta de shadow IT, políticas de atividade e controle de sessão.",k:"Defender for Cloud Apps política de sessão bloquear download"},
{d:2,q:"Onde o sensor do Microsoft Defender for Identity deve ser instalado? <b>(Escolha duas)</b>",o:["Em controladores de domínio","Em servidores AD FS","Em todas as estações de trabalho","No Exchange Online"],a:[0,1],e:"O sensor do MDI vai em controladores de domínio e também em servidores AD FS, AD CS e Entra Connect. Não vai em estações de trabalho.",c:"O MDI observa o tráfego e os eventos do AD local para detectar ataques como pass-the-hash, DCSync e Kerberoasting.",k:"Defender for Identity sensor instalação"},
{d:2,q:"Você quer que anexos de e-mail desconhecidos sejam abertos em um ambiente isolado (sandbox) antes de serem entregues. Qual política do Defender for Office 365 configurar?",o:["Safe Links","Safe Attachments","Anti-spam","Anti-phishing com proteção contra representação"],a:[1],e:"Safe Attachments detona anexos em sandbox antes da entrega. Safe Links verifica URLs no momento do clique.",c:"MDO: Safe Attachments (arquivos), Safe Links (URLs), Anti-phishing (representação/spoofing), ZAP (remoção após a entrega).",k:"Defender for Office 365 Safe Attachments"},

{d:3,q:"Um notebook está comprometido. Você precisa cortar a comunicação dele com a rede, mas continuar investigando pelo Defender for Endpoint. Qual ação usar?",o:["Isolate device","Restrict app execution","Run antivirus scan","Desligar o dispositivo remotamente"],a:[0],e:"O isolamento corta a rede, mas mantém a conexão com o serviço do Defender, o que permite continuar investigando e usar live response.",c:"O isolamento pode ser total ou seletivo (permitindo Outlook e Teams).",k:"Defender for Endpoint isolar dispositivo"},
{d:3,q:"Em uma sessão de <i>live response</i>, qual comando copia um arquivo suspeito do dispositivo para análise?",o:["<code>getfile</code>","<code>run</code>","<code>collect</code>","<code>remediate</code>"],a:[0],e:"<code>getfile</code> baixa o arquivo. <code>run</code> executa um script da biblioteca; <code>collect</code> e <code>remediate</code> têm outros usos.",c:"Live response é um shell remoto no dispositivo: processos, arquivos, scripts e coleta.",k:"Defender for Endpoint live response comandos"},
{d:3,q:"Você precisa de um pacote forense com chaves de autoexecução, processos, conexões e logs de eventos de um dispositivo, sem abrir uma sessão interativa. Qual ação usar?",o:["Collect investigation package","Isolate device","Initiate automated investigation","Add indicator"],a:[0],e:"O investigation package reúne artefatos forenses em um ZIP para download.",c:"Ações de dispositivo: isolar, restringir apps, varredura AV, coletar pacote, iniciar AIR, live response.",k:"Defender for Endpoint coletar pacote de investigação"},
{d:3,q:"O que acontece ao aplicar <b>Restrict app execution</b> a um dispositivo?",o:["O dispositivo é desligado da rede","Só podem ser executados aplicativos assinados pela Microsoft","Todos os aplicativos são desinstalados","O antivírus é desativado"],a:[1],e:"A ação aplica uma política de integridade de código que permite apenas arquivos assinados pela Microsoft.",c:"É útil para conter malware sem cortar a rede.",k:"Defender for Endpoint restringir execução de aplicativos"},
{d:3,q:"Pelo portal do Defender, você quer desabilitar uma conta do Active Directory <b>local</b> que foi comprometida. Qual componente torna isso possível?",o:["Microsoft Defender for Identity (com conta de ação configurada)","Microsoft Defender for Cloud Apps","Microsoft Entra ID Protection","Microsoft Defender for Office 365"],a:[0],e:"As ações do MDI (desabilitar no AD, forçar redefinição de senha) usam a conta de ação configurada. O Entra ID Protection atua sobre contas da nuvem.",c:"Contas locais → MDI. Contas do Entra → ID Protection e Conditional Access.",k:"Defender for Identity ações de resposta desabilitar usuário"},
{d:3,q:"Qual recurso do Defender XDR contém automaticamente usuários e dispositivos comprometidos durante ataques de alta confiança, como ransomware operado por humanos?",o:["Automatic attack disruption","Threat analytics","Secure Score","Alert tuning"],a:[0],e:"O automatic attack disruption contém ativos comprometidos (por exemplo, desabilita contas e contém dispositivos) sozinho, para limitar o avanço do ataque.",c:"A disrupção usa sinais de vários produtos do XDR e só age em cenários de alta confiança.",k:"Defender XDR automatic attack disruption"},
{d:3,q:"Uma regra de automação do Sentinel não consegue executar um playbook. Qual permissão a conta de serviço do Sentinel precisa no grupo de recursos do playbook?",o:["Microsoft Sentinel Automation Contributor","Logic App Operator","Owner","Microsoft Sentinel Reader"],a:[0],e:"A conta de serviço do Sentinel precisa de \"Microsoft Sentinel Automation Contributor\" no grupo de recursos dos playbooks para executá-los a partir de regras de automação.",c:"Essa função existe só para essa finalidade e não é dada a pessoas.",k:"Microsoft Sentinel permissões playbook Automation Contributor"},
{d:3,q:"Você quer atribuir automaticamente todo incidente de severidade alta a um analista sênior e adicionar a tag \"P1\", <b>sem</b> criar um Logic App. O que usar?",o:["Uma regra de automação","Um playbook","Um workbook","Uma regra Fusion"],a:[0],e:"Regras de automação atribuem dono, mudam status e severidade, adicionam tags e tarefas, sem Logic App. Playbooks servem para lógica complexa e integrações.",c:"Regras de automação = triagem leve e orquestração; playbooks = Logic Apps para SOAR completo.",k:"Microsoft Sentinel regras de automação"},
{d:3,q:"Em incidentes de phishing, os analistas devem seguir uma lista padronizada de etapas, visível dentro do próprio incidente. O que usar?",o:["Incident tasks (tarefas de incidente), adicionadas por regra de automação","Watchlists","Bookmarks","Comentários no incidente"],a:[0],e:"Incident tasks criam checklists dentro do incidente e podem ser adicionadas automaticamente por regras de automação ou playbooks.",c:"Tarefas padronizam o processo do SOC e mostram o progresso.",k:"Microsoft Sentinel tarefas de incidente"},
{d:3,q:"Um e-mail de phishing já foi entregue a 300 caixas de correio. Você precisa removê-lo de todas agora. O que fazer?",o:["No Threat Explorer, selecionar as mensagens e usar <i>Take action</i> → exclusão (soft delete)","Criar uma regra de fluxo de e-mail","Bloquear o remetente na Tenant Allow/Block List e aguardar","Pedir que cada usuário apague a mensagem"],a:[0],e:"O Threat Explorer permite remediar mensagens já entregues. Bloquear o remetente ou criar regra de fluxo só afeta mensagens futuras.",c:"O ZAP remove automaticamente o que foi reclassificado como malicioso; o Explorer permite a ação manual.",k:"Threat Explorer remediar e-mails entregues"},
{d:3,q:"Um scanner de vulnerabilidades interno gera alertas recorrentes no Defender for Cloud. Como impedir que esses alertas específicos apareçam?",o:["Criar uma regra de supressão de alertas","Desabilitar o plano Defender for Servers","Remover a VM da assinatura","Criar uma regra de automação no Sentinel"],a:[0],e:"Regras de supressão no Defender for Cloud ocultam alertas conhecidos e benignos sem desligar a proteção.",c:"Suprimir com condições específicas (tipo de alerta, IP, recurso) em vez de desligar planos.",k:"Defender for Cloud regras de supressão de alertas"},
{d:3,q:"O Defender for Cloud Apps detectou atividade suspeita de um usuário no Microsoft 365. Qual ação de governança impede imediatamente que ele faça login?",o:["Suspend user","Notify user","Require user to sign in again","Mark as false positive"],a:[0],e:"\"Suspend user\" bloqueia o login. \"Require user to sign in again\" só encerra as sessões, e o usuário pode entrar de novo.",c:"Ações de governança aplicam respostas nos apps conectados ou no Entra ID.",k:"Defender for Cloud Apps ações de governança suspender usuário"},
{d:3,q:"No Microsoft Entra ID Protection, você seleciona <i>Confirm user compromised</i>. Qual é o efeito?",o:["O risco do usuário passa a ser Alto, e as políticas baseadas em risco são aplicadas","A conta é excluída","A senha é redefinida e enviada por e-mail","Nada acontece até o próximo login"],a:[0],e:"Confirmar o comprometimento eleva o risco do usuário para Alto, o que ativa as políticas de Conditional Access baseadas em risco (bloquear ou exigir troca de senha).",c:"Risco de usuário (credencial vazada) ≠ risco de entrada (login suspeito).",k:"Entra ID Protection confirmar usuário comprometido"},
{d:3,q:"Um alerta contém um comando PowerShell ofuscado. Qual recurso do Microsoft Security Copilot ajuda a entender rapidamente o que ele faz?",o:["Script analysis","Incident summary","Guided response","Generate KQL query"],a:[0],e:"Script analysis explica scripts e linhas de comando, inclusive ofuscados.",c:"No Defender, o Copilot oferece resumo do incidente, resposta guiada, análise de script e arquivo e KQL a partir de linguagem natural.",k:"Security Copilot Defender análise de script"},
{d:3,q:"Onde você aprova ou rejeita ações de remediação pendentes geradas por investigações automatizadas no Defender XDR?",o:["Action center","Threat analytics","Secure Score","Advanced hunting"],a:[0],e:"O Action center concentra ações pendentes e concluídas (manuais e automáticas) para aprovação ou desfazimento.",c:"Pending = aguardando aprovação; History = o que foi feito (dá para desfazer).",k:"Defender XDR Action center"},
{d:3,q:"Um arquivo malicioso está em execução em um dispositivo. Qual ação encerra o processo e coloca o arquivo em quarentena?",o:["Stop and quarantine file","Collect investigation package","Download file","Restrict app execution"],a:[0],e:"Stop and quarantine file encerra os processos e coloca o arquivo em quarentena; pode ser desfeito.",c:"Ações de arquivo: parar e colocar em quarentena, adicionar indicador, baixar, deep analysis.",k:"Defender for Endpoint parar e colocar arquivo em quarentena"},
{d:3,q:"Você quer impedir a execução de um arquivo (hash SHA-256) em todos os dispositivos e remover as cópias existentes. Qual ação de indicador configurar?",o:["Allow","Audit","Block and remediate","Warn"],a:[2],e:"\"Block and remediate\" impede a execução e remedia as instâncias encontradas. Audit só gera alerta.",c:"Indicadores: arquivo (hash), IP, URL/domínio e certificado, com ação Allow, Audit, Warn, Block ou Block and remediate.",k:"Defender for Endpoint indicadores de arquivo"},
{d:3,q:"Ordene as etapas para ingerir logs CEF de um appliance no Sentinel:<br>(1) Configurar o appliance para enviar Syslog/CEF ao encaminhador · (2) Instalar a solução de CEF pelo Content hub · (3) Implantar uma VM Linux como encaminhador · (4) Criar a DCR do conector CEF via AMA apontando para o encaminhador",o:["3 → 2 → 4 → 1","1 → 2 → 3 → 4","2 → 1 → 4 → 3","4 → 3 → 1 → 2"],a:[0],e:"Primeiro o encaminhador (3), depois a solução (2), a DCR que instala o AMA no encaminhador (4) e, por fim, o appliance passa a enviar os logs (1).",c:"Na prova, questões de ordenação cobram a dependência entre as etapas: o destino tem que existir antes da origem enviar.",k:"CEF via AMA Microsoft Sentinel"},

{d:4,q:"Qual consulta retorna o número de logins com falha por usuário nas últimas 24 horas?",o:["<pre>SigninLogs\n| where TimeGenerated > ago(1d)\n| where ResultType != \"0\"\n| summarize count() by UserPrincipalName</pre>","<pre>SigninLogs\n| summarize count() by UserPrincipalName\n| where ResultType != \"0\"</pre>","<pre>SigninLogs\n| where ResultType == \"0\"\n| count</pre>","<pre>SigninLogs\n| project UserPrincipalName\n| take 24</pre>"],a:[0],e:"<code>ResultType</code> \"0\" é sucesso. Filtre o tempo e as falhas antes de agregar. Na opção B, <code>ResultType</code> não existe mais depois do <code>summarize</code>.",c:"Ordem típica no KQL: filtrar (where) → projetar ou estender → agregar (summarize) → ordenar.",k:"KQL summarize where SigninLogs"},
{d:4,q:"Você quer cruzar <code>DeviceProcessEvents</code> com <code>DeviceNetworkEvents</code> do mesmo dispositivo e processo. Qual operador usar?",o:["<code>union</code>","<code>join</code>","<code>extend</code>","<code>mv-expand</code>"],a:[1],e:"<code>join</code> combina linhas por chaves comuns (por exemplo, DeviceId e o ID do processo). <code>union</code> apenas empilha tabelas.",c:"Tipos de join: inner, leftouter, leftanti (o que está à esquerda e não à direita) e outros. O padrão é innerunique.",k:"KQL operador join"},
{d:4,q:"A coluna <code>AdditionalFields</code> contém JSON. Qual função permite acessar as propriedades internas?",o:["<code>parse_json()</code>","<code>tostring()</code>","<code>split()</code>","<code>bin()</code>"],a:[0],e:"<code>parse_json()</code> converte texto em objeto dinâmico, permitindo <code>campo.propriedade</code> ou <code>campo['prop']</code>.",c:"Colunas dynamic aparecem muito em AuditLogs, AdditionalFields e Entities.",k:"KQL parse_json"},
{d:4,q:"Em um <code>summarize</code>, você quer a lista de IPs <b>distintos</b> usados por cada usuário. Qual função usar?",o:["<code>make_list()</code>","<code>make_set()</code>","<code>count()</code>","<code>arg_max()</code>"],a:[1],e:"<code>make_set()</code> gera um array de valores distintos. <code>make_list()</code> mantém os repetidos.",c:"Outras úteis: dcount() (contagem distinta), arg_max() (a linha mais recente por chave).",k:"KQL make_set"},
{d:4,q:"Durante o hunting no Sentinel, você encontra resultados relevantes e quer guardá-los, anotá-los e depois anexá-los a um incidente. O que usar?",o:["Hunting bookmarks","Watchlists","Search jobs","Workbooks"],a:[0],e:"Bookmarks guardam linhas de resultado com notas e entidades e podem ser adicionados a incidentes.",c:"Ciclo do hunting: hipótese → consulta → bookmark → incidente → regra de detecção.",k:"Microsoft Sentinel hunting bookmarks"},
{d:4,q:"Você precisa procurar um IP em <b>um ano</b> de logs, parte deles em retenção de longo prazo. Qual recurso do Sentinel usar?",o:["Search job","Regra NRT","Livestream","Watchlist"],a:[0],e:"Search jobs varrem grandes volumes (inclusive dados arquivados e tabelas Basic) de forma assíncrona; os resultados vão para uma tabela <code>_SRCH</code>.",c:"Search = procurar um termo em muito dado. Restore = trazer um período inteiro de volta para consulta interativa.",k:"Microsoft Sentinel search jobs"},
{d:4,q:"Você precisa de consultas interativas completas, por vários dias, em dados arquivados de um período específico. Qual operação usar e qual sufixo terá a tabela criada?",o:["Restore — sufixo <code>_RST</code>","Search job — sufixo <code>_CL</code>","Export — sufixo <code>_EXP</code>","Ingestion — sufixo <code>_ARC</code>"],a:[0],e:"Restore traz dados arquivados de volta para consulta interativa em uma tabela <code>_RST</code>. (<code>_CL</code> é o sufixo de tabelas de logs personalizados.)",c:"Sufixos: _CL (custom log), _SRCH (search job), _RST (restore).",k:"Log Analytics restaurar logs arquivados"},
{d:4,q:"Você quer usar Python e a biblioteca MSTICPy para análises avançadas sobre dados do Sentinel. O que usar?",o:["Notebooks (Jupyter)","Workbooks","Playbooks","Regras de análise"],a:[0],e:"Os notebooks Jupyter do Sentinel (via Azure ML) integram Python e MSTICPy para enriquecimento, visualização e ML.",c:"Workbooks = dashboards; Playbooks = automação; Notebooks = análise com código.",k:"Microsoft Sentinel notebooks MSTICPy"},
{d:4,q:"No advanced hunting, qual tabela mostra os <b>cliques</b> de usuários em URLs protegidas pelo Safe Links?",o:["<code>EmailEvents</code>","<code>EmailUrlInfo</code>","<code>UrlClickEvents</code>","<code>DeviceNetworkEvents</code>"],a:[2],e:"<code>UrlClickEvents</code> registra os cliques em links protegidos pelo Safe Links. <code>EmailUrlInfo</code> lista as URLs contidas nos e-mails.",c:"Tabelas de e-mail: EmailEvents, EmailAttachmentInfo, EmailUrlInfo, EmailPostDeliveryEvents, UrlClickEvents.",k:"advanced hunting UrlClickEvents"},
{d:4,q:"Você quer encontrar autenticações NTLM contra controladores de domínio observadas pelo Defender for Identity. Qual tabela consultar?",o:["<code>IdentityLogonEvents</code>","<code>DeviceLogonEvents</code>","<code>SigninLogs</code>","<code>AuditLogs</code>"],a:[0],e:"<code>IdentityLogonEvents</code> contém as autenticações observadas pelo MDI no AD (NTLM, Kerberos) e no Entra ID.",c:"Prefixos: Device* (MDE), Email* (MDO), Identity* (MDI), CloudAppEvents (MDCA).",k:"advanced hunting IdentityLogonEvents"},
{d:4,q:"Qual recurso do Defender XDR traz relatórios de especialistas sobre campanhas e ameaças emergentes, mostrando quais ativos da organização estão expostos?",o:["Threat analytics","Action center","Content hub","Secure Score"],a:[0],e:"Threat analytics publica relatórios com exposição, mitigações recomendadas e consultas de hunting relacionadas.",c:"Use para priorizar: quais ameaças atuais afetam o seu ambiente.",k:"Defender XDR threat analytics"},
{d:4,q:"Qual consulta conta eventos de processo em intervalos de 1 hora, para montar um gráfico de série temporal?",o:["<pre>DeviceProcessEvents\n| summarize count() by bin(Timestamp, 1h)</pre>","<pre>DeviceProcessEvents\n| summarize count() by Timestamp</pre>","<pre>DeviceProcessEvents\n| take 1h</pre>","<pre>DeviceProcessEvents\n| where Timestamp == 1h</pre>"],a:[0],e:"<code>bin()</code> arredonda os horários para intervalos fixos, o que é ideal para <code>render timechart</code>.",c:"No Defender XDR a coluna de tempo é Timestamp; no Sentinel/Log Analytics é TimeGenerated.",k:"KQL bin função"},
{d:4,q:"Você quer usar, dentro de uma consulta KQL, uma lista de IOCs em um CSV publicado em uma URL, sem importá-la para o workspace. Qual operador usar?",o:["<code>externaldata</code>","<code>_GetWatchlist</code>","<code>materialize</code>","<code>datatable</code>"],a:[0],e:"<code>externaldata</code> lê dados de uma URL externa (CSV, JSON) durante a execução. <code>datatable</code> define dados fixos na própria consulta.",c:"Para listas mantidas no Sentinel, use watchlists; para fontes externas, externaldata.",k:"KQL externaldata"},
{d:4,q:"No advanced hunting, qual tabela lista as vulnerabilidades (CVEs) de software encontradas nos dispositivos?",o:["<code>DeviceTvmSoftwareVulnerabilities</code>","<code>DeviceInfo</code>","<code>DeviceFileEvents</code>","<code>AlertEvidence</code>"],a:[0],e:"<code>DeviceTvmSoftwareVulnerabilities</code> lista as CVEs por dispositivo e software, segundo o Defender Vulnerability Management.",c:"Tabelas DeviceTvm* trazem inventário, vulnerabilidades e configurações seguras.",k:"DeviceTvmSoftwareVulnerabilities"},
{d:4,q:"Você quer encontrar as consultas de hunting que cobrem a tática <i>Lateral Movement</i> do MITRE ATT&amp;CK e ver lacunas de cobertura no Sentinel. Onde fazer isso?",o:["Na página Hunting (filtrando por tática) e na página MITRE ATT&amp;CK do Sentinel","No Secure Score","Em Watchlists","No Action center"],a:[0],e:"As consultas de hunting são marcadas com táticas e técnicas do MITRE, e a página MITRE ATT&amp;CK mostra a cobertura das regras ativas e as lacunas.",c:"O MITRE ATT&amp;CK organiza o comportamento de atacantes em táticas (o objetivo) e técnicas (o como).",k:"Microsoft Sentinel MITRE ATT&CK cobertura"},

/* ===== Formatos da prova: tela simulada, hotspot, arrastar e soltar, sim/não, estudo de caso ===== */
{d:4,scr:{cap:"Advanced hunting · consulta e resultado",html:`<div class="kql">DeviceProcessEvents
| where Timestamp > ago(7d)
| where FileName =~ "powershell.exe"
| where ProcessCommandLine has_any ("-enc", "-EncodedCommand")
| summarize Execucoes = count() by DeviceName
| top 3 by Execucoes</div>
<table><tr><th>DeviceName</th><th>Execucoes</th></tr><tr><td>srv-app-01</td><td>47</td></tr><tr><td>nb-fin-017</td><td>12</td></tr><tr><td>nb-rh-004</td><td>3</td></tr></table>`},
 q:"Observe a consulta e o resultado na tela. O que o resultado representa?",o:["Os 3 dispositivos com mais execuções de PowerShell com comando codificado nos últimos 7 dias","Todas as execuções de PowerShell dos últimos 7 dias","Os 3 usuários que mais executaram PowerShell","Os 3 primeiros eventos de PowerShell encontrados, sem ordem definida"],a:[0],
 e:"A consulta filtra 7 dias, só <code>powershell.exe</code> (<code>=~</code> ignora maiúsculas), só linhas de comando com <code>-enc</code>/<code>-EncodedCommand</code>, conta por <code>DeviceName</code> e mantém os 3 maiores (<code>top 3 by</code>). Não há coluna de usuário no resultado.",
 c:"PowerShell com comando codificado (Base64) é uma técnica comum de ofuscação (MITRE T1027 / T1059.001). Leia KQL de cima para baixo: cada linha recebe o resultado da anterior.",k:"KQL top summarize advanced hunting"},

{d:3,scr:{cap:"Portal do Defender · Dispositivos · nb-fin-017",html:`<div class="sgrid"><span>Dispositivo</span><span><b>nb-fin-017</b></span><span>Status</span><span><span class="sbadge r">Isolado</span></span><span>Nível de risco</span><span><span class="sbadge r">Alto</span></span><span>Último alerta</span><span>Execução de DLL suspeita em C:\\Temp\\upd.dll</span></div>
<div class="sbtns"><span class="sbtn">Liberar do isolamento</span><span class="sbtn">Restringir execução de aplicativos</span><span class="sbtn">Executar verificação antivírus</span><span class="sbtn">Coletar pacote de investigação</span><span class="sbtn">Iniciar sessão de resposta ao vivo</span></div>`},
 q:"O dispositivo da tela já está isolado. Você precisa obter uma cópia do arquivo <code>C:\\Temp\\upd.dll</code> para análise, sem expor a rede. O que fazer?",o:["Liberar o isolamento, copiar o arquivo e isolar de novo","Iniciar uma sessão de resposta ao vivo e usar o comando <code>getfile</code>","Coletar o pacote de investigação, que inclui todos os arquivos de C:\\Temp","Não é possível obter arquivos de um dispositivo isolado"],a:[1],
 e:"Um dispositivo isolado continua conectado ao serviço do Defender, então o live response funciona e o <code>getfile</code> baixa o arquivo. O pacote de investigação traz artefatos predefinidos (processos, autoruns, logs), não arquivos arbitrários. Liberar o isolamento expõe a rede sem necessidade.",
 c:"Isolar primeiro, investigar depois: o isolamento não atrapalha as ferramentas de resposta do próprio Defender.",k:"Defender for Endpoint live response getfile isolamento"},

{d:2,scr:{cap:"Microsoft Sentinel · Regra de análise agendada · Configuração",html:`<div class="sgrid"><span>Frequência da consulta</span><span>A cada 5 minutos</span><span>Período de consulta</span><span>Última 1 hora</span><span>Limite do alerta</span><span>Número de resultados maior que 0</span><span>Agrupamento de eventos</span><span><b>Agrupar todos os eventos em um único alerta</b></span><span>Supressão</span><span><span class="sbadge n">Desativada</span></span><span>Criar incidentes a partir dos alertas</span><span><span class="sbadge g">Ativado</span></span><span>Agrupamento de alertas</span><span><span class="sbadge n">Desativado</span></span></div>`},
 q:"Com a configuração da tela, uma execução da regra retorna 12 linhas. Quantos alertas e incidentes essa execução gera?",o:["12 alertas e 12 incidentes","1 alerta e 1 incidente","12 alertas e 1 incidente","1 alerta e nenhum incidente"],a:[1],
 e:"\"Agrupar todos os eventos em um único alerta\" gera 1 alerta por execução, não importa quantas linhas. Com criação de incidentes ativada e sem agrupamento de alertas, esse alerta vira 1 incidente. Se a opção fosse \"Disparar um alerta para cada evento\", seriam 12 alertas.",
 c:"Dica de prova: frequência de 5 min com período de 1 h faz as janelas se sobreporem. Os mesmos eventos podem disparar de novo nas próximas execuções; para evitar isso existe a supressão.",k:"Microsoft Sentinel agrupamento de eventos regra agendada"},

{d:1,scr:{cap:"Microsoft Sentinel · Conectores de dados",html:`<table><tr><th>Conector</th><th>Status</th></tr><tr><td>Microsoft Defender XDR</td><td><span class="sbadge g">Conectado</span></td></tr><tr><td>Syslog via AMA</td><td><span class="sbadge g">Conectado</span></td></tr><tr><td>Windows Security Events via AMA</td><td><span class="sbadge g">Conectado</span></td></tr><tr><td>Common Event Format (CEF) via AMA</td><td><span class="sbadge n">Não instalado</span></td></tr></table>
<div class="kql">CommonSecurityLog
| where DeviceVendor == "Palo Alto Networks"</div><div class="note">Resultado: nenhum registro encontrado.</div>`},
 q:"O firewall Palo Alto envia logs em formato CEF para o encaminhador Linux da empresa. A consulta da tela não retorna nada. Qual é a causa mais provável?",o:["A solução e a DCR do conector CEF via AMA não foram configuradas, então nada é gravado na CommonSecurityLog","O conector Syslog via AMA grava CEF na CommonSecurityLog automaticamente; basta esperar 24 horas","A tabela CommonSecurityLog só pode ser consultada no plano Basic","É preciso desconectar o conector Microsoft Defender XDR"],a:[0],
 e:"Uma DCR de Syslog grava na tabela <code>Syslog</code>, sem interpretar o CEF. Para os dados chegarem à <code>CommonSecurityLog</code> já separados em campos, é preciso a solução de CEF e uma DCR do conector CEF via AMA.",
 c:"Syslog via AMA → tabela Syslog. CEF via AMA → tabela CommonSecurityLog. Os dois podem usar o mesmo encaminhador Linux.",k:"CEF via AMA CommonSecurityLog"},

{d:4,scr:{cap:"Log Analytics · SigninLogs · últimos 10 minutos",html:`<table><tr><th>TimeGenerated</th><th>UserPrincipalName</th><th>IPAddress</th><th>ResultType</th></tr>
<tr><td>09:41:02</td><td>ana@luminavarejo.example</td><td>203.0.113.45</td><td>50126</td></tr>
<tr><td>09:41:09</td><td>bruno@luminavarejo.example</td><td>203.0.113.45</td><td>50126</td></tr>
<tr><td>09:41:15</td><td>carla@luminavarejo.example</td><td>203.0.113.45</td><td>50126</td></tr>
<tr><td>09:41:22</td><td>diego@luminavarejo.example</td><td>203.0.113.45</td><td>50126</td></tr>
<tr><td>09:41:30</td><td>elisa@luminavarejo.example</td><td>203.0.113.45</td><td>50126</td></tr>
<tr><td>09:41:37</td><td>fabio@luminavarejo.example</td><td>203.0.113.45</td><td><b>0</b></td></tr></table>`},
 q:"Analise os registros de login da tela. O que eles indicam?",o:["Força bruta contra uma única conta","Password spray a partir de 203.0.113.45, com login bem-sucedido na conta de fabio","Ataque de fadiga de MFA","Reutilização de token de sessão roubado"],a:[1],
 e:"O mesmo IP tenta uma senha em várias contas diferentes em poucos segundos (<code>50126</code> = usuário ou senha inválidos) e acerta uma (<code>0</code> = sucesso). Isso é password spray. Força bruta seria muitas tentativas na mesma conta. Próximos passos: tratar fabio como comprometido (revogar sessões, redefinir senha, exigir MFA) e bloquear o IP.",
 c:"Password spray = poucas senhas comuns × muitas contas, para não disparar o bloqueio por conta.",k:"password spray detecção Entra ID"},

{d:4,t:"hot",
 q:"Complete a consulta para listar quantas conexões cada dispositivo fez com IPs da watchlist <code>IPsMaliciosos</code> nas últimas 24 horas.",
 tpl:`<pre>DeviceNetworkEvents
| where Timestamp > ago(1d)
| where RemoteIP {{0}} (_GetWatchlist('IPsMaliciosos') | project SearchKey)
| {{1}} Conexoes = count() by DeviceName</pre>`,
 opts:[["in","has","==","contains"],["summarize","extend","project","render"]],a:[0,0],
 e:"<code>in</code> compara a coluna com a lista retornada pela subconsulta (a coluna <code>SearchKey</code> da watchlist). <code>summarize ... count() by DeviceName</code> agrega por dispositivo. <code>extend</code> e <code>project</code> não agregam.",
 c:"Em questões de hotspot com KQL, pense no que cada operador recebe e devolve: filtro (where/in), agregação (summarize), formatação (project/extend).",k:"KQL operador in subconsulta"},

{d:2,t:"hot",
 q:"Você está configurando uma regra de análise agendada. Selecione as opções que atendem aos dois requisitos.",
 tpl:`<p>Gerar alerta somente quando a consulta retornar mais de 10 linhas: configure {{0}}.</p><p>Depois de um disparo, não gerar novos alertas da regra por 1 hora: configure {{1}}.</p>`,
 opts:[["o limite do alerta como “maior que 10”","a frequência da consulta para 10 minutos","o agrupamento de eventos","o período de consulta para 10 horas"],["a supressão por 1 hora","o agrupamento de alertas por 1 hora","o período de consulta para 1 hora","a frequência da consulta para 1 hora"]],a:[0,0],
 e:"O limite do alerta (alert threshold) define quantos resultados são necessários para disparar. A supressão para de gerar alertas por um tempo depois de um disparo. O agrupamento de alertas só junta alertas em incidentes, sem impedir que sejam gerados.",
 c:"Frequência = quando a regra roda. Período = quanto tempo de dados ela olha. Limite = quando ela dispara. Supressão = pausa depois de disparar.",k:"Microsoft Sentinel regra agendada limite supressão"},

{d:4,t:"hot",
 q:"Complete a consulta para listar os usuários que fizeram login nas últimas 24 horas, mas <b>não</b> haviam feito login nos 30 dias anteriores.",
 tpl:`<pre>let antigos = SigninLogs
    | where TimeGenerated between (ago(30d) .. ago(1d))
    | distinct UserPrincipalName;
SigninLogs
| where TimeGenerated > ago(1d)
| join kind={{0}} antigos on UserPrincipalName
| {{1}} UserPrincipalName</pre>`,
 opts:[["inner","leftanti","leftouter","rightsemi"],["distinct","take","top","sort by"]],a:[1,0],
 e:"<code>leftanti</code> mantém as linhas da esquerda (logins recentes) que <b>não</b> têm correspondência na direita (usuários antigos). <code>distinct</code> mostra cada usuário uma vez. <code>inner</code> faria o contrário: só quem já existia.",
 c:"leftanti = \"está aqui e não está lá\", muito usado para achar o que é novo ou incomum.",k:"KQL join leftanti"},

{d:4,t:"drag",
 q:"Associe cada tipo de dado à tabela do advanced hunting onde ele é encontrado. Nem todas as tabelas serão usadas.",
 targets:["Criação de processos em endpoints","E-mails entregues ou bloqueados","Autenticações no Active Directory local","Atividades em apps SaaS, como o Microsoft 365"],
 pool:["DeviceProcessEvents","EmailEvents","IdentityLogonEvents","CloudAppEvents","DeviceRegistryEvents","AlertInfo"],a:[0,1,2,3],
 e:"<code>DeviceProcessEvents</code> (MDE) registra processos; <code>EmailEvents</code> (MDO), e-mails; <code>IdentityLogonEvents</code> (MDI), autenticações no AD; <code>CloudAppEvents</code> (MDCA), atividades em apps de nuvem. <code>DeviceRegistryEvents</code> é registro do Windows e <code>AlertInfo</code> é sobre alertas.",
 c:"O prefixo do nome da tabela indica o produto que gera os dados: Device*, Email*, Identity*, CloudApp*.",k:"advanced hunting esquema tabelas"},

{d:3,t:"drag",
 q:"Você precisa que um playbook seja executado automaticamente quando certos incidentes forem criados no Sentinel. Coloque as etapas na ordem correta.",
 targets:["1ª etapa","2ª etapa","3ª etapa","4ª etapa"],
 pool:["Criar o Logic App com o gatilho de incidente do Microsoft Sentinel","Conceder ao Sentinel a função Automation Contributor no grupo de recursos do playbook","Criar a regra de automação com a ação “Executar playbook”","Validar o resultado em um novo incidente gerado pela regra"],a:[0,1,2,3],
 e:"O playbook precisa existir antes (1). Depois o Sentinel precisa de permissão para executá-lo (2); sem isso o playbook nem aparece como opção na regra de automação. Em seguida vem a regra que o dispara (3) e, por fim, a validação (4).",
 c:"Playbook = Logic App com gatilho do Sentinel. Ele é disparado por uma regra de automação ou executado manualmente.",k:"Microsoft Sentinel playbook regra de automação"},

{d:1,t:"drag",
 q:"Associe cada necessidade ao recurso adequado do Sentinel/Log Analytics. Nem todos os recursos serão usados.",
 targets:["Logs usados por regras de detecção agendadas","Logs de depuração volumosos, consultados raramente","Procurar um IP em 2 anos de dados","Investigar a fundo um mês específico de dados arquivados"],
 pool:["Plano Analytics","Plano Basic","Search job","Restore","Workbook","Watchlist"],a:[0,1,2,3],
 e:"Regras de detecção precisam do plano Analytics. Logs volumosos e pouco consultados vão para o Basic. Para procurar um termo em muito dado, use um search job; para consultar um período arquivado de forma interativa, use restore.",
 c:"Custo × capacidade de consulta: Analytics (completo) > Basic (limitado) > retenção de longo prazo (só search ou restore).",k:"Microsoft Sentinel retenção search restore"},

{d:3,t:"yn",
 q:"Para cada afirmação sobre o isolamento de dispositivos no Defender for Endpoint, selecione Sim se for verdadeira ou Não se for falsa.",
 s:["Um dispositivo isolado continua se comunicando com o serviço do Defender for Endpoint.","O isolamento seletivo pode manter o Outlook e o Teams funcionando.","Para isolar um dispositivo, o Defender Antivirus precisa estar em modo passivo."],a:[true,true,false],
 e:"O isolamento mantém a conexão com o serviço para que a investigação continue. O isolamento seletivo permite Outlook, Teams e Skype for Business para comunicação. O modo do antivírus não é pré-requisito para isolar.",
 c:"Nas questões de Sim/Não, cada afirmação é independente. Avalie uma de cada vez.",k:"Defender for Endpoint isolar dispositivo"},

{d:3,t:"yn",
 q:"Para cada afirmação sobre as regras de automação do Microsoft Sentinel, selecione Sim se for verdadeira ou Não se for falsa.",
 s:["Regras de automação podem executar playbooks.","Regras de automação podem ser disparadas quando um incidente é atualizado.","Toda regra de automação exige a criação de um Logic App."],a:[true,true,false],
 e:"Regras de automação têm gatilhos de incidente criado, incidente atualizado e alerta criado, e podem executar playbooks. Ações como atribuir dono, mudar status e severidade, ou adicionar tags e tarefas não precisam de Logic App.",
 c:"Regra de automação = o \"quando\" e as ações simples. Playbook = o \"como\" quando a lógica é complexa.",k:"Microsoft Sentinel regras de automação gatilhos"},

{d:4,t:"yn",
 q:"Para cada afirmação sobre KQL, selecione Sim se for verdadeira ou Não se for falsa.",
 s:["Para procurar termos inteiros, <code>has</code> geralmente é mais eficiente que <code>contains</code>.","O operador <code>=~</code> compara textos sem diferenciar maiúsculas de minúsculas.","<code>project</code> adiciona novas colunas mantendo todas as colunas existentes."],a:[true,true,false],
 e:"<code>has</code> usa o índice de termos e é mais rápido que <code>contains</code>, que procura qualquer trecho. <code>=~</code> é a igualdade sem diferenciar maiúsculas. Quem adiciona colunas mantendo as existentes é <code>extend</code>; <code>project</code> mantém só as colunas listadas.",
 c:"Desempenho no KQL: filtre cedo, prefira has a contains e == a =~ quando possível.",k:"KQL has contains desempenho"},

{d:3,cs:"lumina",
 q:"Para atender ao requisito R3, o que você deve implementar? <b>(Escolha duas)</b>",
 o:["Instalar o sensor do Defender for Identity nos quatro controladores de domínio","Configurar a conta de ação (action account) do Defender for Identity","Criar uma política de risco de usuário no Entra ID Protection","Instalar o Azure Monitor Agent nos controladores de domínio"],a:[0,1],
 e:"Desabilitar contas do AD local pelo portal do Defender é uma ação do Defender for Identity. Ela exige o sensor nos DCs e uma conta de ação com permissão no AD. O Entra ID Protection atua sobre contas da nuvem, e o AMA só coleta logs.",
 c:"No estudo de caso, ligue cada requisito (R1, R2…) a um recurso. Os requisitos são as pistas.",k:"Defender for Identity conta de ação"},

{d:1,cs:"lumina",t:"yn",
 q:"Sobre o requisito R4, selecione Sim se a afirmação for verdadeira ou Não se for falsa.",
 s:["Definir a retenção interativa da tabela CommonSecurityLog em 90 dias e a retenção total em 2 anos atende ao R4.","Com o Microsoft Sentinel habilitado, os primeiros 90 dias de retenção interativa não têm custo adicional.","Regras de análise agendadas conseguem consultar dados que estão apenas na retenção de longo prazo."],a:[true,true,false],
 e:"A retenção interativa de 90 dias atende às consultas, e a retenção total de 2 anos guarda o restante a baixo custo. Workspaces com Sentinel incluem 90 dias de retenção interativa sem custo extra. Dados em retenção de longo prazo só são acessados por search job ou restore, não por regras.",
 c:"Retenção interativa = consultável a qualquer momento. Retenção de longo prazo = barata, mas exige search job ou restore.",k:"Log Analytics retenção de longo prazo Sentinel"},

{d:3,cs:"lumina",t:"hot",
 q:"Você precisa configurar uma regra de automação para atender ao requisito R5. Selecione as opções corretas.",
 tpl:`<p><b>Gatilho:</b> {{0}}</p><p><b>Condição:</b> {{1}}</p><p><b>Ações:</b> {{2}}</p>`,
 opts:[["Quando o incidente é criado","Quando o alerta é criado","Quando o incidente é atualizado"],["Nome da regra de análise contém “Login de executivo fora do país”","Severidade igual a Alta","Status igual a Novo"],["Alterar severidade para Alta + Atribuir proprietário a Ana Souza","Executar playbook","Adicionar a tag “Executivo”"]],a:[0,0,0],
 e:"O R5 vale para incidentes novos gerados por uma regra específica: gatilho \"incidente criado\" e condição pelo nome da regra de análise. Mudar a severidade e atribuir o dono são ações nativas, então não é preciso playbook, o que também atende ao R6 (menor esforço administrativo).",
 c:"Sempre que o caso disser \"minimizar esforço administrativo\", prefira o recurso nativo e mais simples.",k:"Microsoft Sentinel regras de automação condições"},

{d:1,cs:"lumina",t:"drag",
 q:"Associe cada requisito da Lumina ao recurso que o atende. Nem todos os recursos serão usados.",
 targets:["R1 — Fila única de incidentes","R2 — N1 fecha incidentes sem alterar regras","R3 — Desabilitar contas do AD local","R5 — Severidade e dono automáticos"],
 pool:["Conectar o Sentinel ao portal do Defender","Função Microsoft Sentinel Responder","Defender for Identity com conta de ação","Regra de automação","Playbook (Logic App)","Função Microsoft Sentinel Contributor","Defender for Cloud Apps"],a:[0,1,2,3],
 e:"R1: a plataforma unificada no portal do Defender. R2: o Responder gerencia incidentes sem editar regras (Contributor pode demais). R3: ação de resposta do Defender for Identity. R5: regra de automação, que é mais simples que um playbook (R6).",
 c:"Distratores comuns: a opção que funciona, mas com mais permissão (Contributor) ou mais esforço (Playbook) do que o necessário.",k:"Microsoft Sentinel portal do Defender funções"},

/* ===== Lote 3 — Domínio 1 ===== */
{d:1,q:"A empresa tem 3.000 notebooks Windows 11 gerenciados pelo Microsoft Intune. Qual é o método recomendado para integrá-los ao Defender for Endpoint?",o:["Script local executado manualmente em cada notebook","Política de EDR (Endpoint detection and response) no Intune, usando a conexão entre Intune e Defender for Endpoint","Instalar o Azure Monitor Agent","Criar uma regra de coleta de dados no Sentinel"],a:[1],e:"Com dispositivos já gerenciados pelo Intune, a forma recomendada é conectar o Intune ao MDE e distribuir uma política de EDR. O script local serve para testes ou poucos dispositivos, e o AMA coleta logs, não faz a integração.",c:"Métodos de integração: Intune, Configuration Manager, GPO, script local, VDI, Defender for Cloud (servidores) e ferramentas como Ansible ou Puppet para Linux e macOS.",k:"Defender for Endpoint integração Intune"},
{d:1,q:"Você precisa integrar 200 servidores Linux ao Defender for Endpoint e a equipe já usa Ansible. Qual abordagem usar?",o:["Distribuir o instalador e o pacote de integração para Linux com um playbook do Ansible","Usar uma GPO do Active Directory","Isso só é possível pelo Intune","Instalar o sensor do Defender for Identity"],a:[0],e:"O MDE para Linux pode ser implantado com Ansible, Puppet, Chef, Saltstack ou script: instala-se o agente (mdatp) e aplica-se o pacote de integração baixado do portal.",c:"Para servidores no Azure, AWS ou GCP, o Defender for Servers também pode implantar o MDE automaticamente.",k:"Defender for Endpoint Linux implantação Ansible"},
{d:1,q:"Um malware tenta desativar o Microsoft Defender Antivirus e excluir suas configurações. Qual recurso impede isso?",o:["Proteção contra adulteração (tamper protection)","Acesso controlado a pastas","Isolamento de dispositivo","Web content filtering"],a:[0],e:"A proteção contra adulteração bloqueia mudanças nas configurações de segurança, como desativar a proteção em tempo real, feitas fora dos canais de gerenciamento autorizados.",c:"A proteção contra adulteração deve estar ativa em todos os dispositivos e é gerenciada pelo portal do Defender ou pelo Intune.",k:"Defender for Endpoint proteção contra adulteração"},
{d:1,q:"A empresa usa um antivírus de terceiros como principal, e o Defender Antivirus está em modo passivo. Você quer que o Defender for Endpoint ainda bloqueie e remedie artefatos maliciosos detectados pelo EDR. O que habilitar?",o:["EDR em modo bloqueio (EDR in block mode)","Regras ASR em modo auditoria","Modo de verificação completa","Restringir execução de aplicativos"],a:[0],e:"O EDR em modo bloqueio permite que o MDE remedie artefatos detectados pelo EDR mesmo quando o Defender Antivirus não é o antivírus principal.",c:"Defender AV em modo ativo, passivo ou desabilitado muda o que o MDE consegue bloquear. O EDR em modo bloqueio cobre a lacuna do modo passivo.",k:"EDR em modo bloqueio Defender for Endpoint"},
{d:1,q:"Você quer um único modelo de permissões para gerenciar o acesso de analistas ao Defender for Endpoint, Office 365, Identity e Cloud Apps no portal do Defender. O que usar?",o:["RBAC unificado do Microsoft Defender XDR","Funções separadas em cada produto","Unidades administrativas do Entra ID","Funções do Azure RBAC na assinatura"],a:[0],e:"O RBAC unificado do Defender XDR centraliza as permissões das cargas de trabalho do Defender em um único modelo, com funções personalizadas e escopo por fonte de dados.",c:"Funções globais do Entra (como Security Administrator) também dão acesso, mas ferem o menor privilégio. Prefira funções personalizadas no RBAC unificado.",k:"Defender XDR RBAC unificado"},
{d:1,q:"Um provedor de serviços de segurança (MSSP) precisa operar o Sentinel de 15 clientes a partir do próprio tenant, sem criar contas convidadas em cada cliente. O que usar?",o:["Azure Lighthouse","Contas B2B convidadas","Um workspace por cliente no tenant do MSSP","Microsoft Entra Connect"],a:[0],e:"O Azure Lighthouse delega o acesso aos recursos dos clientes (workspaces do Sentinel) para identidades no tenant do MSSP, sem trocar de tenant e sem contas convidadas.",c:"Cenários multitenant do Sentinel: Azure Lighthouse para gerenciar e consultas entre workspaces para correlacionar.",k:"Microsoft Sentinel MSSP Azure Lighthouse"},
{d:1,q:"Seu workspace do Sentinel ingere cerca de 250 GB por dia, de forma estável. Como reduzir o custo de ingestão sem perder dados?",o:["Contratar um nível de compromisso (commitment tier) adequado ao volume","Desabilitar o Sentinel nos fins de semana","Mover todas as tabelas para retenção de longo prazo","Excluir o workspace e recriá-lo todo mês"],a:[0],e:"Os commitment tiers (a partir de 100 GB/dia) dão desconto em relação ao pagamento por GB quando o volume é previsível.",c:"Alavancas de custo: commitment tier, plano Basic ou Auxiliary, transformações na ingestão e retenção bem dimensionada.",k:"Microsoft Sentinel commitment tiers preços"},
{d:1,q:"Você quer descartar eventos irrelevantes e remover colunas desnecessárias <b>antes</b> de os dados serem gravados no workspace, para reduzir custo. O que configurar?",o:["Uma transformação no momento da ingestão (KQL na regra de coleta de dados)","Uma regra de análise que exclui os dados depois","Um workbook com filtro","Uma watchlist de exclusão"],a:[0],e:"Transformações na DCR aplicam uma consulta KQL (<code>source | where ... | project-away ...</code>) aos dados em trânsito. O que é filtrado não é gravado nem cobrado como ingestão no workspace.",c:"Depois de gravados, os dados não podem ser editados. Filtre na origem ou na ingestão.",k:"transformações no momento da ingestão DCR"},
{d:1,q:"Você quer visualizar caminhos de ataque que um invasor poderia seguir na nuvem (por exemplo, de uma VM exposta na internet até um banco de dados sensível). Qual plano do Defender for Cloud oferece isso?",o:["Defender CSPM","CSPM básico (gratuito)","Defender for Storage","Defender for App Service"],a:[0],e:"A análise de caminhos de ataque e o cloud security explorer fazem parte do plano pago Defender CSPM. O CSPM gratuito oferece recomendações e secure score.",c:"CSPM = postura (configurações, riscos). CWP = proteção das cargas (Servers, Storage, Containers…).",k:"Defender CSPM análise de caminho de ataque"},
{d:1,q:"Você quer que as portas RDP e SSH das VMs só fiquem abertas quando um administrador pedir, por tempo limitado e para o IP dele. O que usar?",o:["Acesso just-in-time (JIT) às VMs no Defender for Servers","Isolamento de dispositivo","Regra ASR","Azure Lighthouse"],a:[0],e:"O JIT fecha as portas de gerenciamento no NSG ou no firewall e só as abre sob demanda, por tempo e IP definidos, deixando registro.",c:"O JIT faz parte do Defender for Servers Plano 2.",k:"acesso just-in-time VM Defender for Cloud"},
{d:1,q:"Que tipo de conta o Microsoft recomenda como conta de serviço de diretório (DSA) do Defender for Identity?",o:["Conta de serviço gerenciada de grupo (gMSA)","Conta de Domain Admin","Conta de usuário comum com senha que nunca expira","Conta local do controlador de domínio"],a:[0],e:"A gMSA tem senha gerenciada automaticamente pelo AD e é a opção recomendada. Usar Domain Admin dá privilégio excessivo.",c:"O sensor usa a DSA para consultar o AD (por exemplo, para mapear entidades e caminhos de movimento lateral).",k:"Defender for Identity conta de serviço de diretório gMSA"},
{d:1,q:"Você habilitou o UEBA no Sentinel. Em qual tabela ficam os comportamentos enriquecidos e as anomalias por entidade?",o:["<code>BehaviorAnalytics</code>","<code>SecurityAlert</code>","<code>Heartbeat</code>","<code>Usage</code>"],a:[0],e:"O UEBA grava em <code>BehaviorAnalytics</code> (atividades com enriquecimento e pontuação de investigação) e mantém <code>IdentityInfo</code> e <code>UserPeerAnalytics</code>.",c:"O UEBA cria perfis de comportamento de usuários e hosts para destacar desvios.",k:"Microsoft Sentinel UEBA BehaviorAnalytics"},
{d:1,q:"Você precisa encontrar dispositivos da rede corporativa que ainda <b>não</b> estão integrados ao Defender for Endpoint. Qual recurso usar?",o:["Descoberta de dispositivos (device discovery)","Threat analytics","Live response","Alert tuning"],a:[0],e:"A descoberta de dispositivos usa os endpoints já integrados para encontrar dispositivos não gerenciados na rede e listá-los no inventário.",c:"O que não está integrado não é protegido. A descoberta ajuda a fechar essas lacunas.",k:"Defender for Endpoint descoberta de dispositivos"},
