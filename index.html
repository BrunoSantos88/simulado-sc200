/* ---------- armazenamento local (por navegador) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const pts = h => Math.round(h.ok / h.n * 100);
const K_HIST = "sc200-hist", K_STATS = "sc200-stats", K_SESS = "sc200-sess";

/* ---------- Claude (tira-dúvidas) ---------- */
let sample = null;
const sampleReady = (window.claude && typeof window.claude.use === "function")
  ? window.claude.use("sample").then(s => (sample = s)).catch(() => null)
  : Promise.resolve(null);
let tutorOff = !(window.claude && typeof window.claude.use === "function");
const chats = {};

/* ---------- utilitários ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
const L = i => String.fromCharCode(65 + i);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const strip = h => { const t = document.createElement("div"); t.innerHTML = h; return t.textContent; };
const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60), x = s % 60; return `${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}`; };
const learnUrl = k => "https://learn.microsoft.com/pt-br/search/?terms=" + encodeURIComponent(k);
const typ = q => q.t || "mc";
const isRight = it => {
  const q = Q[it.qi], a = q.a;
  if (typ(q) === "mc") return it.sel.length === a.length && a.every(x => it.sel.includes(x));
  return a.every((v, i) => it.sel[i] === v);
};
const anyAns = it => typ(Q[it.qi]) === "mc" ? it.sel.length > 0 : it.sel.some(v => v !== null && v !== undefined);
const fullAns = it => typ(Q[it.qi]) === "mc" ? it.sel.length > 0 : it.sel.every(v => v !== null && v !== undefined);
const nSlots = q => ({ yn: () => q.s.length, hot: () => q.opts.length, drag: () => q.targets.length })[typ(q)]?.() ?? 0;
const TYPE_LABEL = { mc: "", yn: "Sim / Não", hot: "Hotspot", drag: "Arrastar e soltar" };

let S = null;     // sessão atual
let tick = null;
let cfg = { mode: "treino", dom: "all", n: "10", shuffle: true, pool: "all" };
const QTY = { treino: ["10", "20", "35", "45"], prova: ["35", "40", "45"] };
const qtyOpts = () => { if (!QTY[cfg.mode].includes(cfg.n)) cfg.n = QTY[cfg.mode][0]; return QTY[cfg.mode].map(n => `<option ${cfg.n === n ? "selected" : ""} value="${n}">${n} questões aleatórias</option>`).join(""); };

/* ---------- tela inicial ---------- */
function home() {
  stopTimer(); setBar("", 0);
  const hist = store.get(K_HIST, []);
  const stats = store.get(K_STATS, {});
  const saved = store.get(K_SESS, null);
  const wrongIds = Object.keys(stats).filter(k => stats[k].w > 0 && stats[k].last === 0).map(Number);
  const byDom = [1, 2, 3, 4].map(d => {
    const ids = Q.map((q, i) => i).filter(i => Q[i].d === d);
    const seen = ids.filter(i => stats[i]); const ok = seen.filter(i => stats[i].last === 1).length;
    return { d, total: ids.length, seen: seen.length, pct: seen.length ? Math.round(ok / seen.length * 100) : null };
  });

  app.innerHTML = `
  <section class="hero">
    <div class="label">Microsoft Security Operations Analyst</div>
    <h1>Simulado SC-200 em português</h1>
    <p>${Q.length} questões originais, escritas a partir do guia oficial de habilidades, nos formatos da prova: múltipla escolha, telas simuladas, hotspot, arrastar e soltar, sim/não e estudo de caso. Cada questão tem resposta comentada, o conceito-chave e um tira-dúvidas com o Claude.</p>
  </section>

  ${saved ? `<div class="panel row"><div><b>Você tem uma tentativa em andamento.</b><div class="note">${saved.mode === "prova" ? "Modo prova" : "Modo aprendizagem"} · questão ${saved.idx + 1} de ${saved.items.length}</div></div><div class="spacer"></div><button class="btn ghost" id="discard">Descartar</button><button class="btn primary" id="resume">Continuar</button></div>` : ""}

  <div class="panel">
    <div class="label">Modo</div>
    <div class="modes" style="margin-top:8px">
      <button class="mode" data-mode="treino" aria-pressed="${cfg.mode === "treino"}"><b>Aprendizagem · com dicas</b><small>Botão de dica em cada questão, correção na hora e explicação da resposta.</small></button>
      <button class="mode" data-mode="prova" aria-pressed="${cfg.mode === "prova"}"><b>Prova · sem dicas</b><small>Como a prova real: sem dicas nem correção até o fim, com cronômetro (100 s por questão) e nota de 0 a 100.</small></button>
    </div>
    <div class="fields">
      <label class="field"><span class="label">Domínio</span>
        <select id="fDom"><option value="all">Todos os domínios</option>${[1,2,3,4].map(d => `<option value="${d}" ${cfg.dom == d ? "selected" : ""}>${d}. ${DOM[d]}</option>`).join("")}</select></label>
      <label class="field"><span class="label">Quantidade</span>
        <select id="fN">${qtyOpts()}</select></label>
      <label class="field"><span class="label">Quais questões</span>
        <select id="fPool"><option value="all">Todas</option><option value="fmt" ${cfg.pool === "fmt" ? "selected" : ""}>Só formatos da prova (imagem, hotspot, arrastar, sim/não, caso)</option><option value="wrong" ${cfg.pool === "wrong" ? "selected" : ""} ${wrongIds.length ? "" : "disabled"}>Só as que errei por último (${wrongIds.length})</option><option value="new" ${cfg.pool === "new" ? "selected" : ""}>Só as que nunca respondi</option></select></label>
    </div>
    <label class="check" style="margin-top:14px"><input type="checkbox" id="fShuf" ${cfg.shuffle ? "checked" : ""}> Embaralhar alternativas</label>
    <div class="row" style="margin-top:16px"><div class="spacer"></div><button class="btn primary" id="go">Começar</button></div>
    <div id="startMsg" class="note"></div>
  </div>

  <div class="panel">
    <div class="label">Seu desempenho por domínio</div>
    <div class="domains">${byDom.map(x => `
      <div class="dom"><span class="tag">D${x.d}</span><span>${DOM[x.d]}<br><span class="note">${x.seen} de ${x.total} respondidas</span></span>
      <span class="row" style="gap:8px"><span class="meter"><i style="width:${x.pct ?? 0}%"></i></span><span class="stat">${x.pct === null ? "—" : x.pct + "%"}</span></span></div>`).join("")}
    </div>
  </div>

  <div class="panel">
    <div class="row"><div class="label">Histórico</div><div class="spacer"></div>${hist.length ? `<button class="btn ghost" id="clr" style="padding:4px 10px;font-size:14px">Apagar histórico</button>` : ""}</div>
    <div id="clrConfirm"></div>
    ${hist.length ? `<div class="tbl"><table class="hist"><tr><th>Data</th><th>Modo</th><th>Acertos</th><th>Nota</th></tr>
      ${hist.slice().reverse().slice(0, 12).map(h => `<tr><td>${new Date(h.t).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })}</td><td>${h.mode === "prova" ? "Prova" : "Aprendizagem"}</td><td>${h.ok}/${h.n}</td><td><span class="pill ${pts(h) >= 70 ? "ok" : "bad"}">${pts(h)}/100</span></td></tr>`).join("")}</table></div>`
      : `<p class="note" style="margin:8px 0 0">Nenhuma tentativa ainda. Suas notas aparecem aqui ao terminar um simulado (ficam salvas neste navegador).</p>`}
  </div>`;

  app.querySelectorAll(".mode").forEach(b => b.onclick = () => { cfg.mode = b.dataset.mode; app.querySelectorAll(".mode").forEach(x => x.setAttribute("aria-pressed", x === b)); $("#fN").innerHTML = qtyOpts(); });
  $("#go").onclick = () => {
    cfg.dom = $("#fDom").value; cfg.n = $("#fN").value; cfg.pool = $("#fPool").value; cfg.shuffle = $("#fShuf").checked;
    let ids = Q.map((q, i) => i).filter(i => cfg.dom === "all" || Q[i].d == cfg.dom);
    if (cfg.pool === "wrong") ids = ids.filter(i => wrongIds.includes(i));
    if (cfg.pool === "new") ids = ids.filter(i => !stats[i]);
    if (cfg.pool === "fmt") ids = ids.filter(i => Q[i].t || Q[i].scr || Q[i].cs);
    if (!ids.length) { $("#startMsg").textContent = "Nenhuma questão atende a esses filtros. Escolha outro domínio ou \"Todas\"."; return; }
    ids = shuffle(ids);
    if (ids.length < Number(cfg.n)) $("#startMsg").textContent = `Só há ${ids.length} questões com esses filtros; todas foram incluídas.`;
    start(ids.slice(0, Number(cfg.n)), cfg.mode);
  };
  if (saved) { $("#resume").onclick = () => { S = saved; S.resumedAt = Date.now(); render(); startTimer(); }; $("#discard").onclick = () => { store.del(K_SESS); home(); }; }
  const clr = $("#clr");
  if (clr) clr.onclick = () => {
    $("#clrConfirm").innerHTML = `<div class="confirm row">Apagar histórico e desempenho deste navegador?<div class="spacer"></div><button class="btn ghost" id="no">Cancelar</button><button class="btn primary" id="yes">Apagar</button></div>`;
    $("#no").onclick = () => $("#clrConfirm").innerHTML = "";
    $("#yes").onclick = () => { store.del(K_HIST); store.del(K_STATS); home(); };
  };
}

/* ---------- sessão ---------- */
function start(ids, mode) {
  S = { mode, idx: 0, finished: false, used: 0, limit: mode === "prova" ? ids.length * 100 : 0,
        items: ids.map(qi => {
          const q = Q[qi], t = typ(q);
          const base = t === "mc" ? q.o.map((_, i) => i) : t === "drag" ? q.pool.map((_, i) => i) : [];
          return { qi, order: cfg.shuffle || t === "drag" ? shuffle(base) : base, sel: t === "mc" ? [] : Array(nSlots(q)).fill(null), done: false, mk: false };
        }) };
  S.resumedAt = Date.now();
  save(); render(); startTimer();
}
function save() { if (S && !S.finished) store.set(K_SESS, { ...S, used: elapsed() , resumedAt: undefined }); }
function elapsed() { return S ? S.used + (S.resumedAt ? Math.floor((Date.now() - S.resumedAt) / 1000) : 0) : 0; }
function startTimer() {
  stopTimer();
  const t = $("#timer");
  if (!S || S.mode !== "prova" || S.finished) { t.hidden = true; return; }
  t.hidden = false;
  const upd = () => { const left = S.limit - elapsed(); t.textContent = fmt(left); t.classList.toggle("low", left < 300); if (left <= 0) finish(); };
  upd(); tick = setInterval(upd, 1000);
}
function stopTimer() { if (tick) clearInterval(tick); tick = null; }
function setBar(txt, pct) { $("#barStat").textContent = txt; $("#prog").style.width = pct + "%"; }

/* ---------- questão ---------- */
let pick = null; // item escolhido no arrastar e soltar (toque)

function qBody(it, live) {
  const q = Q[it.qi], t = typ(q);
  const cs = q.cs ? `<details class="case" ${live ? "open" : ""}><summary>${CASES[q.cs].title}</summary><div class="cbody">${CASES[q.cs].html}</div></details>` : "";
  const scr = q.scr ? `<div class="screen"><div class="cap"><b>${q.scr.cap}</b><span>Tela ilustrativa</span></div><div class="scr">${q.scr.html}</div></div>` : "";
  let hint = "";
  if (t === "mc" && q.a.length > 1) hint = `Selecione ${q.a.length} alternativas.`;
  if (t === "hot") hint = "Escolha uma opção em cada lista.";
  if (t === "drag") hint = "Arraste cada item até o destino certo, ou toque no item e depois no destino. Toque em um destino preenchido para devolver o item.";
  if (t === "yn") hint = "Marque Sim ou Não em cada linha.";
  return `${cs}<div class="qtext" ${cs ? 'style="margin-top:12px"' : ""}>${q.q}</div>${hint && live ? `<div class="qhint">${hint}</div>` : ""}${scr}${answerUI(it, live)}`;
}

function answerUI(it, live) {
  const q = Q[it.qi], t = typ(q);
  if (t === "mc") {
    const multi = q.a.length > 1;
    return `<div class="opts" role="${multi ? "group" : "radiogroup"}">${it.order.map((oi, pos) => {
      let cls = it.sel.includes(oi) ? "sel" : "";
      const out = (it.elim || []).includes(oi);
      if (!live) cls = q.a.includes(oi) ? "right" : (it.sel.includes(oi) ? "wrong" : "");
      if (live && out) return `<div class="opt locked elim" aria-disabled="true"><span class="key">${L(pos)}</span><span class="body">${q.o[oi]}</span></div>`;
      return live
        ? `<label class="opt ${cls}"><input type="${multi ? "checkbox" : "radio"}" name="opt" value="${oi}" ${it.sel.includes(oi) ? "checked" : ""}><span class="key">${L(pos)}</span><span class="body">${q.o[oi]}</span></label>`
        : `<div class="opt locked ${cls}"><span class="key">${L(pos)}</span><span class="body">${q.o[oi]}</span></div>`;
    }).join("")}</div>`;
  }
  if (t === "yn") {
    return `<div class="tbl"><table class="yn"><tr><th>Afirmação</th><th>Sim</th><th>Não</th>${live ? "" : "<th>Correta</th>"}</tr>${q.s.map((s, i) => {
      const v = it.sel[i], rc = live ? "" : (v === q.a[i] ? "right" : "wrong");
      return `<tr class="${rc}"><td>${s}</td>
        <td class="c"><input type="radio" name="yn${i}" data-i="${i}" value="1" ${v === true ? "checked" : ""} ${live ? "" : "disabled"} aria-label="Sim, afirmação ${i + 1}"></td>
        <td class="c"><input type="radio" name="yn${i}" data-i="${i}" value="0" ${v === false ? "checked" : ""} ${live ? "" : "disabled"} aria-label="Não, afirmação ${i + 1}"></td>
        ${live ? "" : `<td class="c"><span class="mark ${v === q.a[i] ? "ok" : "bad"}">${q.a[i] ? "Sim" : "Não"}</span></td>`}</tr>`;
    }).join("")}</table></div>`;
  }
  if (t === "hot") {
    const html = q.tpl.replace(/\{\{(\d+)\}\}/g, (m, n) => {
      n = Number(n); const v = it.sel[n], opts = q.opts[n];
      if (live) return `<select class="hs" data-slot="${n}" aria-label="Lacuna ${n + 1}"><option value="">— escolha —</option>${opts.map((o, j) => `<option value="${j}" ${v === j ? "selected" : ""}>${o}</option>`).join("")}</select>`;
      if (v === q.a[n]) return `<span class="hsv ok">${opts[v]}</span>`;
      return `${v !== null ? `<span class="hsv bad">${opts[v]}</span> ` : ""}<span class="hsv ok">${opts[q.a[n]]}</span>`;
    });
    return `<div class="hot">${html}</div>`;
  }
  // drag
  const used = new Set(it.sel.filter(v => v !== null));
  const pool = live ? `<div><h4>Itens</h4><div class="pool">${it.order.filter(pi => !used.has(pi)).map(pi => `<button class="dchip ${pick === pi ? "picked" : ""}" draggable="true" data-pi="${pi}">${q.pool[pi]}</button>`).join("") || '<span class="note">Todos os itens foram usados.</span>'}</div></div>` : "";
  const slots = `<div><h4>${live ? "Destinos" : "Sua resposta"}</h4><div class="slots">${q.targets.map((tg, i) => {
    const v = it.sel[i];
    if (live) return `<div class="slot"><span class="lbl">${tg}</span><button class="drop ${v !== null ? "has" : ""}" data-slot="${i}">${v !== null ? q.pool[v] : "Solte aqui"}</button></div>`;
    const ok = v === q.a[i];
    return `<div class="slot"><span class="lbl">${tg}</span><div class="drop ${ok ? "ok" : "bad"}">${v !== null ? q.pool[v] : "(vazio)"}${ok ? "" : `<span class="fix">Correto: ${q.pool[q.a[i]]}</span>`}</div></div>`;
  }).join("")}</div></div>`;
  return `<div class="dd" ${live ? "" : 'style="grid-template-columns:1fr"'}>${pool}${slots}</div>`;
}

function wireBody(it, root) {
  const q = Q[it.qi], t = typ(q);
  const refresh = sel => { save(); render(); if (sel) { const el = app.querySelector(sel); if (el) el.focus(); } };
  if (t === "mc") root.querySelectorAll('input[name="opt"]').forEach(inp => inp.onchange = () => {
    const v = Number(inp.value);
    if (q.a.length > 1) it.sel = inp.checked ? [...new Set([...it.sel, v])] : it.sel.filter(x => x !== v);
    else it.sel = [v];
    refresh(`input[name="opt"][value="${v}"]`);
  });
  if (t === "yn") root.querySelectorAll(".yn input").forEach(inp => inp.onchange = () => {
    it.sel[Number(inp.dataset.i)] = inp.value === "1"; refresh(`.yn input[data-i="${inp.dataset.i}"][value="${inp.value}"]`);
  });
  if (t === "hot") root.querySelectorAll("select.hs").forEach(s => s.onchange = () => {
    it.sel[Number(s.dataset.slot)] = s.value === "" ? null : Number(s.value); refresh(`select.hs[data-slot="${s.dataset.slot}"]`);
  });
  if (t === "drag") {
    root.querySelectorAll(".dchip").forEach(c => {
      c.onclick = () => { const pi = Number(c.dataset.pi); pick = pick === pi ? null : pi; render(); };
      c.ondragstart = e => { e.dataTransfer.setData("text/plain", c.dataset.pi); e.dataTransfer.effectAllowed = "move"; };
    });
    root.querySelectorAll(".drop").forEach(d => {
      const slot = Number(d.dataset.slot);
      d.onclick = () => {
        if (pick !== null) { it.sel[slot] = pick; pick = null; }
        else if (it.sel[slot] !== null) it.sel[slot] = null;
        refresh();
      };
      d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };
      d.ondragleave = () => d.classList.remove("over");
      d.ondrop = e => { e.preventDefault(); const pi = Number(e.dataTransfer.getData("text/plain")); if (Number.isInteger(pi)) { it.sel[slot] = pi; pick = null; refresh(); } };
    });
  }
}

function render() {
  const it = S.items[S.idx], q = Q[it.qi], t = typ(q);
  const answered = S.items.filter(x => S.mode === "treino" ? x.done : anyAns(x)).length;
  setBar(`${S.idx + 1}/${S.items.length} · ${answered} respondidas`, answered / S.items.length * 100);
  const showRes = S.mode === "treino" && it.done;
  const chip = txt => `<span class="pill" style="background:var(--accent-soft);color:var(--accent)">${txt}</span>`;

  app.innerHTML = `
  <article class="qcard">
    <div class="qmeta"><span class="pill" style="background:var(--sunk);color:var(--muted)">D${q.d} · ${DOM[q.d]}</span>${TYPE_LABEL[t] ? chip(TYPE_LABEL[t]) : ""}${q.cs ? chip("Estudo de caso") : ""}${q.scr ? chip("Com imagem") : ""}${it.mk ? `<span class="pill warn">Marcada para revisão</span>` : ""}</div>
    <div class="label">Questão ${S.idx + 1}</div>
    ${qBody(it, !showRes)}
    ${S.mode === "treino" && it.h ? hintBox(it) : ""}
    ${showRes ? explain(it) : ""}
    <div class="nav">
      <button class="btn" id="prev" ${S.idx === 0 ? "disabled" : ""}>Anterior</button>
      <button class="btn ghost" id="mark">${it.mk ? "Desmarcar" : "Marcar para revisão"}</button>
      ${S.mode === "treino" && !it.done ? `<button class="btn ghost" id="hint" ${(it.h || 0) >= maxHints(it) ? "disabled" : ""}>${(it.h || 0) === 0 ? "Pedir dica" : (it.h || 0) < maxHints(it) ? "Mais uma dica" : "Dicas usadas"}</button>` : ""}
      <div class="spacer"></div>
      ${S.mode === "treino" && !it.done ? `<button class="btn primary" id="check" ${fullAns(it) ? "" : "disabled"}>Confirmar resposta</button>` : ""}
      ${S.idx < S.items.length - 1 ? `<button class="btn ${S.mode === "prova" || it.done ? "primary" : ""}" id="next">Próxima</button>` : `<button class="btn primary" id="end">Finalizar</button>`}
    </div>
    <div id="endConfirm"></div>
  </article>
  <div class="grid">${S.items.map((x, i) => {
    let c = "";
    if (S.mode === "treino" && x.done) c = isRight(x) ? "ok" : "bad"; else if (anyAns(x)) c = "ans";
    return `<button class="cell ${c} ${i === S.idx ? "cur" : ""} ${x.mk ? "mk" : ""}" data-i="${i}" aria-label="Questão ${i + 1}">${i + 1}</button>`;
  }).join("")}</div>
  <div class="legend"><span>● laranja = marcada</span>${S.mode === "treino" ? "<span>verde = acertou · vermelho = errou</span>" : "<span>azul = respondida</span>"}</div>`;

  if (!showRes) wireBody(it, app.querySelector(".qcard"));
  $("#prev").onclick = () => go(S.idx - 1);
  $("#mark").onclick = () => { it.mk = !it.mk; save(); render(); };
  const nx = $("#next"); if (nx) nx.onclick = () => go(S.idx + 1);
  const hb = $("#hint"); if (hb) hb.onclick = () => useHint(it);
  const ck = $("#check"); if (ck) ck.onclick = () => { it.done = true; record(it); save(); render(); };
  const en = $("#end"); if (en) en.onclick = askFinish;
  app.querySelectorAll(".cell").forEach(c => c.onclick = () => go(Number(c.dataset.i)));
  if (showRes) wireTutor(it, app.querySelector(".tutor"));
}
/* ---------- dicas (modo aprendizagem) ---------- */
function wrongOpts(it) { const q = Q[it.qi]; return typ(q) === "mc" ? it.order.filter(oi => !q.a.includes(oi)) : []; }
function nElim(it) { return Math.min(2, Math.max(0, wrongOpts(it).length - 1)); }
function maxHints(it) { return nElim(it) > 0 ? 2 : 1; }
function useHint(it) {
  const h = it.h || 0; if (h >= maxHints(it)) return;
  if (h === 0 && nElim(it) > 0) { it.elim = wrongOpts(it).slice(0, nElim(it)); it.sel = it.sel.filter(x => !it.elim.includes(x)); }
  it.h = h + 1; save(); render();
}
function hintBox(it) {
  const q = Q[it.qi], n = nElim(it), lines = [];
  if (n > 0) lines.push(`<p><b>Dica 1:</b> ${n === 1 ? "1 alternativa errada foi eliminada." : n + " alternativas erradas foram eliminadas."}</p>`);
  if (it.h >= maxHints(it)) lines.push(`<p><b>Dica ${n > 0 ? 2 : 1} · conceito-chave:</b> ${q.c}</p>`);
  return `<div class="hintbox"><div class="label" style="color:var(--warn)">Dicas</div>${lines.join("")}</div>`;
}
function go(i) { if (i < 0 || i >= S.items.length) return; S.idx = i; pick = null; save(); render(); window.scrollTo({ top: 0 }); }
function askFinish() {
  const pend = S.items.filter(x => S.mode === "treino" ? !x.done : !anyAns(x)).length;
  const mk = S.items.filter(x => x.mk).length;
  $("#endConfirm").innerHTML = `<div class="confirm row"><span>${pend ? `${pend} questão(ões) sem resposta. ` : ""}${mk ? `${mk} marcada(s) para revisão. ` : ""}Finalizar agora?</span><div class="spacer"></div><button class="btn ghost" id="no">Voltar</button><button class="btn primary" id="yes">Finalizar</button></div>`;
  $("#no").onclick = () => $("#endConfirm").innerHTML = "";
  $("#yes").onclick = finish;
}
function record(it) {
  const st = store.get(K_STATS, {}); const r = isRight(it) ? 1 : 0;
  const s = st[it.qi] || { ok: 0, w: 0 }; r ? s.ok++ : s.w++; s.last = r; st[it.qi] = s; store.set(K_STATS, st);
}

/* ---------- explicação + tutor ---------- */
function answerText(it, mine) {
  const q = Q[it.qi], t = typ(q), src = mine ? it.sel : q.a, dash = "—";
  if (t === "mc") return it.order.map((oi, pos) => src.includes(oi) ? L(pos) : null).filter(Boolean).join(" e ") || "nenhuma";
  if (t === "yn") return src.map((v, i) => `${i + 1}: ${v === null ? dash : v ? "Sim" : "Não"}`).join(" · ");
  if (t === "hot") return src.map((v, i) => `lacuna ${i + 1}: ${v === null ? dash : strip(q.opts[i][v])}`).join(" · ");
  return src.map((v, i) => `${strip(q.targets[i])} → ${v === null ? dash : strip(q.pool[v])}`).join(" · ");
}

function explain(it) {
  const q = Q[it.qi], ok = isRight(it);
  return `
  <div class="verdict ${ok ? "ok" : "bad"}">${ok ? "Correto." : `Incorreto. Resposta certa: ${answerText(it, false)}.`}</div>
  <div class="learn">
    <section><h3>Por que essa é a resposta</h3><p>${q.e}</p></section>
    <section><h3>Conceito-chave</h3><p>${q.c}</p></section>
    <section><h3>Estude no Microsoft Learn</h3><p><a href="${learnUrl(q.k)}" target="_blank" rel="noopener">Pesquisar “${q.k}” na documentação oficial</a></p></section>
  </div>
  <div class="tutor" ${tutorOff ? "hidden" : ""}>
    <h3>Tirar dúvida com o Claude</h3>
    <div class="note">Pergunte qualquer coisa sobre esta questão. As respostas usam a sua conta do Claude; a primeira pergunta pede sua permissão.</div>
    <div class="chips">
      <button class="chip">Explique de forma mais simples</button>
      <button class="chip">Por que as outras alternativas estão erradas?</button>
      <button class="chip">Dê um exemplo prático no dia a dia de um SOC</button>
      <button class="chip">Como esse tema costuma cair na prova?</button>
    </div>
    <div class="msgs"></div>
    <div class="ask"><textarea id="ask-${it.qi}" rows="2" placeholder="Digite sua dúvida…"></textarea><button class="btn primary" data-send>Perguntar</button></div>
  </div>`;
}

function wireTutor(it, box) {
  if (!box) return;
  const msgs = box.querySelector(".msgs"), ta = box.querySelector("textarea"), send = box.querySelector("[data-send]");
  const turns = chats[it.qi] || (chats[it.qi] = []);
  const draw = () => { msgs.innerHTML = ""; turns.forEach(t => { const d = document.createElement("div"); d.className = "msg " + (t.role === "user" ? "me" : "ai"); d.textContent = t.content; msgs.append(d); }); };
  draw();
  sampleReady.then(s => { if (!s) box.hidden = true; });
  let busy = false;
  const ask = async text => {
    text = text.trim(); if (!text || busy || !sample) return;
    busy = true; send.disabled = true; ta.value = "";
    turns.push({ role: "user", content: text }); draw();
    const out = document.createElement("div"); out.className = "msg ai"; out.textContent = "Pensando…"; msgs.append(out);
    try {
      const { text: ans } = await sample([{ role: "user", content: context(it) }, ...turns], { cache: false, onText: ({ text }) => { out.textContent = text; } });
      turns.push({ role: "assistant", content: ans });
    } catch (e) {
      turns.pop();
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) { tutorOff = true; box.hidden = true; return; }
      out.className = "msg err";
      out.textContent = e.code === "rate_limited" ? "Muitas perguntas seguidas ou limite de uso atingido. Espere um pouco e tente de novo."
        : e.code === "session_expired" ? "Sua sessão expirou. Entre de novo no claude.ai e tente outra vez."
        : e.code === "refused" ? "O Claude não respondeu a essa pergunta. Tente reformular."
        : "Não foi possível obter a resposta agora. Tente de novo.";
    } finally { busy = false; send.disabled = false; }
  };
  send.onclick = () => ask(ta.value);
  ta.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(ta.value); } };
  box.querySelectorAll(".chip").forEach(c => c.onclick = () => ask(c.textContent));
}

function context(it) {
  const q = Q[it.qi], t = typ(q);
  let alts;
  if (t === "mc") alts = "Alternativas:\n" + it.order.map((oi, pos) => `${L(pos)}) ${strip(q.o[oi])}`).join("\n");
  else if (t === "yn") alts = "Formato: Sim/Não. Afirmações:\n" + q.s.map((s, i) => `${i + 1}) ${strip(s)}`).join("\n");
  else if (t === "hot") alts = "Formato: hotspot (lacunas com listas de opções). Texto:\n" + strip(q.tpl.replace(/\{\{(\d+)\}\}/g, (m, n) => `[lacuna ${Number(n) + 1}]`)) + "\nOpções:\n" + q.opts.map((o, i) => `lacuna ${i + 1}: ${o.map(strip).join(" | ")}`).join("\n");
  else alts = "Formato: arrastar e soltar. Destinos:\n" + q.targets.map((x, i) => `${i + 1}) ${strip(x)}`).join("\n") + "\nItens disponíveis: " + q.pool.map(strip).join(" | ");
  const extra = (q.cs ? `\nEstudo de caso:\n${strip(CASES[q.cs].html)}\n` : "") + (q.scr ? `\nConteúdo da tela mostrada na questão (${q.scr.cap}):\n${strip(q.scr.html)}\n` : "");
  const right = answerText(it, false), mine = answerText(it, true);
  return `Você é um tutor da certificação Microsoft SC-200 (Microsoft Security Operations Analyst). Responda sempre em português do Brasil, em texto simples (sem Markdown, sem tabelas), de forma didática e direta, com no máximo cerca de 200 palavras, a menos que o aluno peça mais detalhes. Use os nomes atuais dos produtos (Microsoft Defender XDR, Microsoft Sentinel, Microsoft Entra ID). Se não tiver certeza de um detalhe, diga isso e sugira conferir no Microsoft Learn.

Domínio: ${DOM[q.d]}
${extra}Questão: ${strip(q.q)}
${alts}
Resposta correta: ${right}
Resposta do aluno: ${mine}
Explicação oficial do simulado: ${strip(q.e)}
Conceito-chave: ${strip(q.c)}

A seguir vêm as dúvidas do aluno sobre esta questão.`;
}

/* ---------- resultado ---------- */
function finish() {
  stopTimer();
  S.used = elapsed(); S.resumedAt = null; S.finished = true;
  if (S.mode === "prova") S.items.forEach(x => { x.done = true; if (anyAns(x)) record(x); });
  const ok = S.items.filter(x => x.done && isRight(x)).length;
  const n = S.items.length, score = Math.round(ok / n * 100);
  const hist = store.get(K_HIST, []); hist.push({ t: Date.now(), mode: S.mode, n, ok, score }); store.set(K_HIST, hist.slice(-50));
  store.del(K_SESS);
  results(ok, n, score);
}

function results(ok, n, score) {
  $("#timer").hidden = true; setBar("Resultado", 100);
  const doms = [1, 2, 3, 4].map(d => { const xs = S.items.filter(x => Q[x.qi].d === d); return { d, n: xs.length, ok: xs.filter(isRight).length }; }).filter(x => x.n);
  const wrong = S.items.filter(x => !isRight(x));
  app.innerHTML = `
  <div class="panel">
    <div class="label">${S.mode === "prova" ? "Modo prova" : "Modo aprendizagem"} · tempo ${fmt(S.used)}</div>
    <div class="score" style="margin-top:8px">
      <div class="big">${score}<small> / 100</small></div>
      <div><span class="pill ${score >= 70 ? "ok" : "bad"}">${score >= 70 ? "Aprovado (meta 70)" : "Abaixo de 70"}</span><div class="note" style="margin-top:6px">${ok} de ${n} corretas</div></div>
    </div>
    <div class="domains" style="margin-top:16px">${doms.map(x => { const p = Math.round(x.ok / x.n * 100); return `
      <div class="dom"><span class="tag">D${x.d}</span><span>${DOM[x.d]}</span><span class="row" style="gap:8px"><span class="meter"><i style="width:${p}%"></i></span><span class="stat">${x.ok}/${x.n}</span></span></div>`; }).join("")}</div>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="home">Início</button><div class="spacer"></div>
      ${wrong.length ? `<button class="btn primary" id="retry">Refazer as ${wrong.length} que errei</button>` : ""}
    </div>
  </div>
  <h2 style="margin-top:24px;font-size:20px">Revisão das questões</h2>
  <p class="note">Abra uma questão para ver a explicação e tirar dúvidas com o Claude.</p>
  <div class="review">${S.items.map((x, i) => `
    <details class="rv" data-i="${i}"><summary><span class="pill ${isRight(x) ? "ok" : anyAns(x) ? "bad" : "warn"}">${isRight(x) ? "Certa" : anyAns(x) ? "Errada" : "Em branco"}</span><span class="stat">${i + 1}.</span><span class="t">${strip(Q[x.qi].q)}</span></summary><div class="rvbody"></div></details>`).join("")}</div>`;

  $("#home").onclick = home;
  const rt = $("#retry"); if (rt) rt.onclick = () => start(shuffle(wrong.map(x => x.qi)), "treino");
  app.querySelectorAll("details.rv").forEach(d => d.addEventListener("toggle", () => {
    if (!d.open) return; const body = d.querySelector(".rvbody"); if (body.dataset.on) return; body.dataset.on = 1;
    const it = S.items[Number(d.dataset.i)];
    body.innerHTML = `<div style="margin-top:10px">${qBody(it, false)}</div>${explain(it)}`;
    wireTutor(it, body.querySelector(".tutor"));
  }));
  window.scrollTo({ top: 0 });
}

window.addEventListener("beforeunload", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
home();
</script>

</body></html>
