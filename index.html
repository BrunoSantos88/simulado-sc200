<tr><td>carla@lumina.example</td><td>ClickAllowed</td><td>true</td></tr><tr><td>diego@lumina.example</td><td>ClickBlocked</td><td>false</td></tr></table>`},
 q:"Além de remover os e-mails das quatro caixas, qual usuário deve ser priorizado para redefinição de senha e revogação de sessões?",o:["carla","diego","Todos os quatro destinatários","Nenhum, porque o e-mail será removido"],a:[0],
 e:"Só a carla chegou ao site (<code>ClickAllowed</code>, <code>IsClickedThrough = true</code>), então pode ter digitado credenciais. O clique de diego foi bloqueado pelo Safe Links. Os quatro recebem a remoção do e-mail.",
 c:"Escopo do incidente de phishing: quem recebeu (EmailEvents) → quem clicou (UrlClickEvents) → quem logou de lugares estranhos depois (SigninLogs).",k:"UrlClickEvents ActionType ClickAllowed"},

/* ===== Lote 3 — Hotspot ===== */
{d:4,t:"hot",
 q:"Complete a consulta para listar usuários com mais de 10 falhas de login que também tiveram pelo menos um login bem-sucedido.",
 tpl:`<pre>SigninLogs
| where TimeGenerated > ago(1d)
| summarize Falhas = {{0}}(ResultType != "0"),
            Sucessos = countif(ResultType == "0") by UserPrincipalName
| where Falhas > 10 and Sucessos {{1}} 0</pre>`,
 opts:[["countif","count","dcount","sum"],[">","<","==","!="]],a:[0,0],
 e:"<code>countif(condição)</code> conta só as linhas que atendem à condição. Assim falhas e sucessos saem no mesmo <code>summarize</code>. <code>Sucessos > 0</code> mantém quem teve ao menos um sucesso, um sinal de senha descoberta.",
 c:"Muitas falhas seguidas de um sucesso é o padrão clássico de força bruta ou password spray bem-sucedido.",k:"KQL countif"},

{d:4,t:"hot",
 q:"Complete a consulta para obter o estado mais recente de cada dispositivo e exibir só o nome e o sistema operacional.",
 tpl:`<pre>DeviceInfo
| summarize {{0}}(Timestamp, *) by DeviceId
| {{1}} DeviceName, OSPlatform</pre>`,
 opts:[["arg_max","max","make_set","take_any"],["project","extend","summarize","where"]],a:[0,0],
 e:"<code>arg_max(Timestamp, *)</code> retorna a linha completa mais recente por dispositivo. <code>max(Timestamp)</code> traria só a data. <code>project</code> escolhe as colunas exibidas.",
 c:"max() devolve o valor; arg_max() devolve a linha.",k:"KQL arg_max project"},

{d:4,t:"hot",
 q:"A coluna <code>Entities</code> da tabela SecurityAlert contém um array JSON. Complete a consulta para obter uma linha por endereço IP envolvido nos alertas.",
 tpl:`<pre>SecurityAlert
| extend Ents = parse_json(Entities)
| {{0}} Ents
| where Ents.Type == "ip"
| {{1}} IP = tostring(Ents.Address)</pre>`,
 opts:[["mv-expand","summarize","join","project"],["extend","summarize","render","distinct"]],a:[0,0],
 e:"<code>mv-expand</code> transforma cada elemento do array em uma linha. Depois, <code>extend</code> cria a coluna IP a partir da propriedade Address.",
 c:"Arrays em colunas dinâmicas → mv-expand. Objetos JSON → parse_json + acesso por ponto.",k:"KQL mv-expand"},

{d:3,t:"hot",
 q:"Selecione a ação adequada do Defender for Endpoint para cada necessidade.",
 tpl:`<p>Impedir conexões ao domínio <code>malicioso.example</code> em todos os dispositivos: {{0}}.</p><p>Impedir que um executável específico rode em qualquer dispositivo e remover as cópias existentes: {{1}}.</p>`,
 opts:[["Indicador de URL/domínio com ação Bloquear","Isolar todos os dispositivos","Uma regra ASR","Uma categoria no web content filtering"],["Indicador de hash do arquivo com ação Block and remediate","Executar verificação antivírus completa","Restringir execução de aplicativos em todos os dispositivos","Coletar pacote de investigação"]],a:[0,0],
 e:"Indicadores são a forma direcionada de bloquear um IoC específico: domínio (com Network Protection) ou hash de arquivo. Isolar ou restringir todos os dispositivos seria desproporcional.",
 c:"IoC específico → indicador. Categoria de sites → web content filtering. Comportamento genérico → ASR.",k:"Defender for Endpoint indicadores"},

{d:2,t:"hot",
 q:"Selecione o plano ou recurso do Defender for Cloud que atende a cada necessidade.",
 tpl:`<p>Receber alertas quando arquivos com malware forem enviados para contas de armazenamento: {{0}}.</p><p>Reduzir a exposição de RDP e SSH das VMs sem perder o acesso administrativo: {{1}}.</p>`,
 opts:[["Defender for Storage com verificação de malware","Defender for Key Vault","Defender CSPM","Defender for App Service"],["Acesso just-in-time às VMs","Defender for Containers","Workflow automation","Continuous export"]],a:[0,0],
 e:"A verificação de malware no upload é do Defender for Storage. O JIT, do Defender for Servers P2, controla as portas de gerenciamento.",
 c:"Associe cada plano ao tipo de recurso que ele protege.",k:"Defender for Cloud planos"},

{d:3,t:"hot",
 q:"Configure a automação do Sentinel para os dois cenários.",
 tpl:`<p>Executar um playbook manualmente sobre um IP, a partir da página da entidade: o playbook usa o gatilho {{0}}.</p><p>Executar um playbook automaticamente em todo incidente novo: o playbook usa o gatilho de incidente e é chamado por {{1}}.</p>`,
 opts:[["de entidade","de incidente","de alerta","de recorrência"],["uma regra de automação","uma regra de análise","um workbook","uma watchlist"]],a:[0,0],
 e:"Playbooks com gatilho de entidade rodam sob demanda sobre uma entidade. Para execução automática em incidentes, o playbook usa o gatilho de incidente e é chamado por uma regra de automação.",
 c:"Regras de análise não chamam playbooks com gatilho de incidente diretamente; isso é papel das regras de automação.",k:"Microsoft Sentinel gatilhos de playbook"},

{d:4,t:"hot",
 q:"Complete a consulta para criar uma série temporal de logins por hora e marcar anomalias.",
 tpl:`<pre>SigninLogs
| {{0}} Logins = count() default = 0 on TimeGenerated from ago(14d) to now() step 1h by UserPrincipalName
| extend (Anomalias, Pontuacao, Base) = {{1}}(Logins)</pre>`,
 opts:[["make-series","summarize","render","bin"],["series_decompose_anomalies","series_fit_line","make_list","percentile"]],a:[0,0],
 e:"A sintaxe <code>... on TimeGenerated from ... to ... step ...</code> é do <code>make-series</code>. <code>series_decompose_anomalies</code> devolve as anomalias (-1, 0, 1), a pontuação e a linha de base.",
 c:"make-series preenche os intervalos vazios com default = 0, o que é essencial para detectar anomalias corretamente.",k:"KQL make-series anomalias"},

{d:2,t:"hot",
 q:"Selecione o controle de acesso adequado para cada nível de risco no Entra ID Protection.",
 tpl:`<p>Usuário com risco <b>Alto</b>: {{0}}.</p><p>Login com risco <b>Médio ou Alto</b>: {{1}}.</p>`,
 opts:[["Exigir alteração de senha (com MFA)","Exigir MFA apenas","Permitir sem controles","Exigir dispositivo em conformidade"],["Exigir MFA","Exigir alteração de senha","Bloquear sempre, sem exceção","Permitir sem controles"]],a:[0,0],
 e:"Pela recomendação da Microsoft, risco de usuário é tratado com troca segura de senha, e risco de entrada com MFA. Os dois são configurados como condições no Conditional Access.",
 c:"Autorremediação reduz a carga do SOC: o próprio usuário resolve o risco com controles fortes.",k:"Entra ID Protection políticas de risco Conditional Access"},

/* ===== Lote 3 — Arrastar e soltar ===== */
{d:3,t:"drag",
 q:"Associe cada objetivo à ação de resposta do Defender for Endpoint. Nem todas as ações serão usadas.",
 targets:["Cortar a comunicação de rede, mantendo a conexão com o Defender","Permitir só a execução de aplicativos assinados pela Microsoft","Obter artefatos forenses do dispositivo","Executar um arquivo em sandbox e ver o comportamento"],
 pool:["Isolar dispositivo","Restringir execução de aplicativos","Coletar pacote de investigação","Análise profunda (deep analysis)","Executar verificação antivírus","Adicionar indicador"],a:[0,1,2,3],
 e:"Isolar → rede. Restringir execução → só apps assinados pela Microsoft. Pacote de investigação → forense. Deep analysis → sandbox. A verificação antivírus e os indicadores têm outros objetivos.",
 c:"Decore a dupla ação → efeito: é a base das questões de resposta a incidentes.",k:"Defender for Endpoint ações de resposta"},

{d:4,t:"drag",
 q:"Monte a consulta para listar os 5 IPs com mais falhas de login nas últimas 24 horas. Coloque as linhas na ordem correta.",
 targets:["Linha 1","Linha 2","Linha 3","Linha 4"],
 pool:["SigninLogs","| where TimeGenerated > ago(1d) and ResultType != \"0\"","| summarize Falhas = count() by IPAddress","| top 5 by Falhas"],a:[0,1,2,3],
 e:"Primeiro a tabela, depois o filtro de tempo e falhas, a agregação por IP e, por fim, os 5 maiores. O <code>top</code> precisa da coluna Falhas, que só existe depois do <code>summarize</code>.",
 c:"Cada linha do KQL só enxerga as colunas produzidas pelas linhas anteriores.",k:"KQL summarize top"},

{d:2,t:"drag",
 q:"Associe cada necessidade ao plano do Defender for Cloud. Nem todos os planos serão usados.",
 targets:["Acesso just-in-time e integração com o Defender for Endpoint nas VMs","Verificação de malware em blobs enviados","Vulnerabilidades em imagens do registro e alertas de runtime do Kubernetes","Análise de caminhos de ataque e cloud security explorer"],
 pool:["Defender for Servers","Defender for Storage","Defender for Containers","Defender CSPM","Defender for Key Vault","Defender for App Service"],a:[0,1,2,3],
 e:"Servers → VMs (JIT, MDE). Storage → malware em blobs. Containers → imagens e Kubernetes. Defender CSPM → caminhos de ataque.",
 c:"CSPM = postura do ambiente. Os demais planos = proteção de cada tipo de carga.",k:"Defender for Cloud planos Defender"},

{d:4,t:"drag",
 q:"Associe cada função do KQL ao que ela retorna. Nem todas as funções serão usadas.",
 targets:["A linha mais recente de cada grupo","A quantidade de valores distintos","Um array com valores distintos","A quantidade de linhas que atendem a uma condição"],
 pool:["arg_max()","dcount()","make_set()","countif()","bin()","ago()"],a:[0,1,2,3],
 e:"<code>arg_max()</code> → linha do valor máximo. <code>dcount()</code> → contagem distinta. <code>make_set()</code> → array distinto. <code>countif()</code> → contagem condicional. <code>bin()</code> arredonda valores e <code>ago()</code> calcula datas relativas.",
 c:"Funções de agregação só funcionam dentro de summarize (ou make-series).",k:"KQL funções de agregação"},

{d:2,t:"drag",
 q:"Associe cada objetivo ao recurso do Defender for Office 365. Nem todos os recursos serão usados.",
 targets:["Verificar URLs no momento do clique","Abrir anexos em sandbox antes da entrega","Remover e-mails maliciosos já entregues automaticamente","Simular campanhas de phishing para treinar usuários"],
 pool:["Safe Links","Safe Attachments","Zero-hour auto purge (ZAP)","Attack simulation training","Política anti-spam","DKIM"],a:[0,1,2,3],
 e:"Safe Links → clique. Safe Attachments → sandbox. ZAP → remoção depois da entrega. Attack simulation training → simulações. Anti-spam e DKIM tratam de outros problemas.",
 c:"MDO protege antes da entrega (filtros, sandbox), no clique (Safe Links) e depois da entrega (ZAP, AIR).",k:"Defender for Office 365 recursos"},

/* ===== Lote 3 — Sim / Não ===== */
{d:4,t:"yn",q:"Sobre o advanced hunting do Defender XDR, selecione Sim se a afirmação for verdadeira ou Não se for falsa.",
 s:["Os dados ficam disponíveis por até 30 dias.","Detecções personalizadas podem executar ações automáticas, como isolar o dispositivo.","O advanced hunting só consulta tabelas do Defender for Endpoint."],a:[true,true,false],
 e:"O advanced hunting guarda 30 dias. Detecções personalizadas podem disparar ações (isolar, coletar pacote, colocar arquivo em quarentena etc.). As tabelas cobrem MDE, MDO, MDI, MDCA, alertas e outras fontes.",
 c:"Uma tela para todos os sinais do XDR, com KQL.",k:"Defender XDR advanced hunting visão geral"},
{d:2,t:"yn",q:"Sobre o Microsoft Defender for Identity, selecione Sim se a afirmação for verdadeira ou Não se for falsa.",
 s:["O sensor deve ser instalado nos controladores de domínio.","O MDI pode detectar ataques de DCSync.","O MDI exige um agente em todas as estações de trabalho."],a:[true,true,false],
 e:"O sensor vai em DCs (e AD FS, AD CS, Entra Connect). O DCSync é uma das detecções clássicas. Estações de trabalho não recebem o sensor do MDI.",
 c:"MDI = visão do Active Directory local.",k:"Defender for Identity visão geral"},
{d:1,t:"yn",q:"Sobre o UEBA do Microsoft Sentinel, selecione Sim se a afirmação for verdadeira ou Não se for falsa.",
 s:["O UEBA grava os resultados na tabela BehaviorAnalytics.","O UEBA usa fontes como os logs de login e auditoria do Entra ID.","Ao habilitar o UEBA, as regras de análise são desativadas."],a:[true,true,false],
 e:"O UEBA grava em BehaviorAnalytics e usa fontes como SigninLogs, AuditLogs e SecurityEvent. Ele complementa as regras de análise; não as substitui nem as desativa.",
 c:"UEBA = contexto e anomalias de comportamento para priorizar a investigação.",k:"Microsoft Sentinel UEBA fontes de dados"},
{d:1,t:"yn",q:"Sobre proteção de endpoints, selecione Sim se a afirmação for verdadeira ou Não se for falsa.",
 s:["O EDR em modo bloqueio remedia artefatos mesmo quando um antivírus de terceiros é o principal.","A proteção contra adulteração impede que malware desative o Defender Antivirus.","O EDR em modo bloqueio exige que o Defender Antivirus esteja em modo ativo."],a:[true,true,false],
 e:"O EDR em modo bloqueio existe justamente para quando o Defender AV está em modo passivo. A proteção contra adulteração protege as configurações de segurança.",
 c:"Modo passivo = o Defender AV não bloqueia sozinho; o EDR em modo bloqueio compensa.",k:"EDR em modo bloqueio requisitos"},
{d:2,t:"yn",q:"Sobre o Defender for Cloud Apps, selecione Sim se a afirmação for verdadeira ou Não se for falsa.",
 s:["O Cloud Discovery pode usar dados de tráfego do Defender for Endpoint.","Marcar um app como não sancionado pode bloqueá-lo nos dispositivos com MDE.","Políticas de sessão funcionam sem o Conditional Access App Control."],a:[true,true,false],
 e:"A integração com o MDE alimenta o Cloud Discovery e permite bloquear apps não sancionados. Políticas de sessão exigem que a sessão passe pelo Conditional Access App Control.",
 c:"Sessão em tempo real (bloquear download, copiar e colar) = Conditional Access App Control.",k:"Defender for Cloud Apps Conditional Access App Control"},
{d:3,t:"yn",q:"Sobre playbooks do Microsoft Sentinel, selecione Sim se a afirmação for verdadeira ou Não se for falsa.",
 s:["Playbooks são baseados em Azure Logic Apps.","Um playbook com gatilho de incidente pode ser executado por uma regra de automação.","Playbooks só podem ser executados automaticamente, nunca de forma manual."],a:[true,true,false],
 e:"Playbooks são Logic Apps com gatilhos do Sentinel. Podem ser executados por regras de automação ou manualmente, a partir de um incidente, alerta ou entidade.",
 c:"Manual = o analista decide na hora. Automático = regra de automação.",k:"Microsoft Sentinel playbooks"},

/* ===== Lote 3 — Estudo de caso Tecnova ===== */
{d:1,cs:"tecnova",q:"Para atender ao requisito T1, o que você deve usar?",
 o:["Azure Lighthouse, delegando o acesso ao workspace para o tenant da Vigia SOC","Contas B2B convidadas para cada analista da Vigia SOC","Um segundo workspace do Sentinel no tenant da Vigia SOC, copiando os dados","Microsoft Entra Connect entre os dois tenants"],a:[0],
 e:"O Azure Lighthouse permite que identidades do tenant do parceiro gerenciem recursos do cliente sem contas convidadas, exatamente como pede o T1.",
 c:"\"Sem contas convidadas\" + \"a partir do próprio tenant\" = Azure Lighthouse.",k:"Azure Lighthouse Microsoft Sentinel"},
{d:1,cs:"tecnova",q:"Para atender ao requisito T2 nos servidores locais, o que você deve fazer?",
 o:["Integrar os servidores ao Azure Arc e habilitar o Defender for Servers na assinatura","Instalar só o sensor do Defender for Identity","Criar um conector Syslog","Habilitar o Defender for Storage"],a:[0],
 e:"Servidores fora do Azure entram no Defender for Cloud pelo Azure Arc. Com o Defender for Servers habilitado, o MDE é implantado e eles aparecem no inventário e nas recomendações.",
 c:"Fora do Azure (local, AWS, GCP) → Azure Arc ou conectores multicloud para entrar no Defender for Cloud.",k:"Azure Arc Defender for Servers servidores locais"},
{d:1,cs:"tecnova",t:"hot",q:"Configure a coleta para atender ao requisito T3.",
 tpl:`<p><b>Conector:</b> {{0}}</p><p><b>Conjunto de eventos:</b> {{1}}</p>`,
 opts:[["Windows Security Events via AMA","Syslog via AMA","Common Event Format (CEF) via AMA","Windows Forwarded Events"],["Comum (Common)","Todos os eventos de segurança","Mínimo (Minimal)","Nenhum"]],a:[0,0],
 e:"Eventos de segurança de servidores Windows vêm pelo conector Windows Security Events via AMA, que oferece os conjuntos All, Common, Minimal e Custom. O T3 pede o conjunto Common.",
 c:"Common = trilha de auditoria completa com volume moderado. All = tudo. Minimal = só eventos que indicam ameaças.",k:"Windows Security Events via AMA conjuntos de eventos"},
{d:3,cs:"tecnova",t:"yn",q:"Sobre os requisitos T4 e T5, selecione Sim se a afirmação for verdadeira ou Não se for falsa.",
 s:["Configurar o grupo de dispositivos dos servidores críticos com \"Semi — require approval for any remediation\" atende ao T4.","Uma transformação na regra de coleta de dados pode remover a coluna EventData antes da ingestão, atendendo ao T5.","Para atender ao T5 é preciso um Logic App que apague a coluna depois que os dados forem gravados."],a:[true,true,false],
 e:"O nível Semi com aprovação para qualquer remediação atende ao T4. Transformações na DCR removem colunas em trânsito (T5). Dados já gravados não podem ser editados por Logic App, e o custo de ingestão já teria sido cobrado.",
 c:"Reduzir custo de ingestão = agir antes de gravar.",k:"transformação DCR remover coluna"},
{d:1,cs:"tecnova",t:"drag",q:"Associe cada requisito da Tecnova ao recurso que o atende. Nem todos os recursos serão usados.",
 targets:["T1 — SOC do parceiro a partir do próprio tenant","T2 — Servidores locais no Defender for Cloud e no MDE","T3 — Eventos de segurança dos DCs (conjunto Common)","T5 — Remover coluna antes de gravar"],
 pool:["Azure Lighthouse","Azure Arc + Defender for Servers","Windows Security Events via AMA","Transformação na DCR","Contas B2B convidadas","Agente Log Analytics (MMA)","Plano Basic"],a:[0,1,2,3],
 e:"T1 → Lighthouse. T2 → Arc + Defender for Servers. T3 → conector via AMA com o conjunto Common. T5 → transformação na DCR. Contas convidadas violam o T1, o MMA foi descontinuado e o plano Basic não remove colunas.",
 c:"Elimine os distratores pelo requisito: \"sem convidados\", \"agente atual\", \"antes de gravar\".",k:"Microsoft Sentinel arquitetura multitenant AMA"},
{d:4,q:"Qual tabela do advanced hunting lista o <b>inventário de software</b> instalado em cada dispositivo (fornecedor, nome e versão)?",o:["<code>DeviceTvmSoftwareInventory</code>","<code>DeviceInfo</code>","<code>DeviceTvmSoftwareVulnerabilitiesKB</code>","<code>DeviceProcessEvents</code>"],a:[0],e:"DeviceTvmSoftwareInventory traz o software instalado por dispositivo. DeviceInfo traz dados da máquina (SO, domínio); a tabela KB traz detalhes das CVEs; DeviceProcessEvents traz processos executados.",c:"Família DeviceTvm*: SoftwareInventory (o que está instalado), SoftwareVulnerabilities (CVEs por dispositivo), SoftwareVulnerabilitiesKB (detalhes da CVE), SecureConfigurationAssessment (configurações).",k:"DeviceTvmSoftwareInventory advanced hunting"},
{d:4,q:"Você quer listar apenas as CVEs dos seus dispositivos que têm <b>exploit público disponível</b>, ordenadas pela pontuação CVSS. Com qual tabela você deve combinar <code>DeviceTvmSoftwareVulnerabilities</code>?",o:["<code>DeviceTvmSoftwareVulnerabilitiesKB</code>, pela coluna <code>CveId</code>","<code>DeviceInfo</code>, pela coluna <code>DeviceName</code>","<code>AlertEvidence</code>, pela coluna <code>AlertId</code>","<code>DeviceTvmSoftwareInventory</code>, pela coluna <code>SoftwareVendor</code>"],a:[0],e:"A tabela KB é a base de conhecimento das vulnerabilidades: tem CvssScore, IsExploitAvailable, descrição e data de publicação. O join é feito por CveId.",c:"A tabela por dispositivo diz ONDE está a CVE; a tabela KB diz O QUE é a CVE.",k:"DeviceTvmSoftwareVulnerabilitiesKB IsExploitAvailable"},
{d:4,q:"Qual tabela mostra se cada dispositivo está em conformidade com controles de configuração segura, como firewall ativado ou BitLocker?",o:["<code>DeviceTvmSecureConfigurationAssessment</code>","<code>DeviceRegistryEvents</code>","<code>DeviceTvmSoftwareInventory</code>","<code>DeviceEvents</code>"],a:[0],e:"DeviceTvmSecureConfigurationAssessment registra, por dispositivo, o resultado de cada configuração avaliada (ConfigurationId, IsCompliant, IsApplicable).",c:"Configuração insegura também é exposição; o Defender Vulnerability Management avalia software e configurações.",k:"DeviceTvmSecureConfigurationAssessment"},
{d:1,q:"No Defender Vulnerability Management, você quer pedir à equipe de TI que aplique uma correção recomendada e acompanhar o andamento, com integração ao Microsoft Intune. O que usar?",o:["Solicitar correção (remediation request) a partir da recomendação de segurança","Criar um indicador de arquivo","Abrir uma sessão de live response","Criar uma regra de detecção personalizada"],a:[0],e:"Na página da recomendação, \"Request remediation\" cria uma atividade de correção acompanhada em Remediation; com a integração ativa, gera uma tarefa de segurança no Intune.",c:"Fluxo do DVM: descobrir → priorizar (recomendações) → corrigir (remediation request) ou aceitar o risco (exceção).",k:"Defender Vulnerability Management solicitar correção"},
{d:1,q:"Uma recomendação de segurança não pode ser aplicada em alguns servidores porque existe um controle compensatório. Como evitar que ela continue pesando na priorização desses servidores?",o:["Criar uma exceção para a recomendação, com justificativa e prazo","Excluir os servidores do Defender for Endpoint","Desativar o Defender Vulnerability Management","Marcar o alerta como falso positivo"],a:[0],e:"Exceções registram a justificativa (por exemplo, controle compensatório ou risco aceito) e podem ter data de expiração, mantendo a rastreabilidade.",c:"Exceção ≠ ignorar: ela documenta a decisão de risco e pode expirar.",k:"Defender Vulnerability Management exceções recomendações"},
{d:1,q:"Qual métrica do Defender Vulnerability Management reflete o quanto os dispositivos da organização estão expostos a ameaças, em que <b>quanto menor, melhor</b>?",o:["Exposure score","Microsoft Secure Score for Devices","Secure Score do Defender for Cloud","Pontuação CVSS"],a:[0],e:"O exposure score (0 a 100) mede a exposição atual; quanto menor, melhor. O Secure Score for Devices mede a postura de configuração, e quanto maior, melhor.",c:"Exposure score ↓ é bom; Secure Score ↑ é bom.",k:"Defender Vulnerability Management exposure score"},
{d:1,q:"Você precisa encontrar dispositivos <b>não gerenciados</b> (sem o sensor do Defender) na rede corporativa, usando os dispositivos já integrados. O que usar?",o:["Device discovery do Defender for Endpoint","Um search job do Sentinel","O conector Azure Activity","Uma watchlist"],a:[0],e:"O device discovery usa os endpoints integrados para descobrir outros dispositivos da rede (modo padrão faz sondagem ativa) e os mostra no inventário para integração.",c:"Não dá para proteger o que você não sabe que existe: descoberta é o primeiro passo da gestão de exposição.",k:"Defender for Endpoint device discovery"},

{d:1,q:"Ao habilitar o UEBA no Microsoft Sentinel, de quais fontes de identidade ele pode sincronizar perfis de usuários?",o:["Microsoft Entra ID e Active Directory local (por meio do Defender for Identity)","Somente de uma watchlist importada","Do Microsoft Purview","Do Intune"],a:[0],e:"O UEBA sincroniza identidades do Entra ID e, para o AD local, usa o Defender for Identity. Depois você escolhe as fontes de dados a analisar (logs de entrada, auditoria, eventos de segurança).",c:"Configurar UEBA: ativar → escolher diretórios → escolher fontes de dados.",k:"Microsoft Sentinel habilitar UEBA"},
{d:4,q:"Em uma consulta no Sentinel, você precisa enriquecer resultados com o departamento, o cargo e o gerente dos usuários, sincronizados pelo UEBA. Qual tabela usar?",o:["<code>IdentityInfo</code>","<code>BehaviorAnalytics</code>","<code>SigninLogs</code>","<code>Anomalies</code>"],a:[0],e:"IdentityInfo guarda os atributos das identidades sincronizadas. BehaviorAnalytics guarda as atividades enriquecidas com o contexto de comportamento; Anomalies guarda os resultados das regras de anomalia.",c:"Tabelas do UEBA: IdentityInfo (quem é), BehaviorAnalytics (o que fez e quão incomum foi), UserPeerAnalytics (pares).",k:"Microsoft Sentinel UEBA IdentityInfo"},
{d:3,q:"Durante a investigação, você quer ver em um só lugar a linha do tempo de alertas, atividades e insights de comportamento de um usuário no Sentinel. O que abrir?",o:["A página da entidade (entity page) do usuário","O Content hub","A página de conectores de dados","A lista de watchlists"],a:[0],e:"A entity page reúne informações da conta, linha do tempo de alertas e atividades e insights gerados pelo UEBA.",c:"Entidades mapeadas nas regras alimentam as entity pages e o gráfico de investigação.",k:"Microsoft Sentinel página de entidade"},
{d:2,q:"Você quer testar um novo limite para uma regra de <b>anomalia</b> do Sentinel sem perder a versão em produção. O que fazer?",o:["Duplicar a regra, ajustar os parâmetros e rodar a cópia em modo Flighting","Editar a consulta KQL da regra original","Converter a regra em NRT","Desativar a regra original por uma semana"],a:[0],e:"Regras de anomalia não têm a lógica editável, mas podem ser duplicadas com parâmetros ajustados. A cópia roda em Flighting (teste) em paralelo à versão de Production, para comparar resultados.",c:"Regras de anomalia são baseadas em ML; você ajusta limites, não o KQL.",k:"Microsoft Sentinel regras de anomalia flighting"},

{d:1,q:"Um engenheiro precisa criar e editar regras de análise e workbooks no Sentinel, mas não deve gerenciar outras configurações do Azure. Seguindo o menor privilégio, qual função atribuir?",o:["Microsoft Sentinel Contributor","Microsoft Sentinel Responder","Owner do grupo de recursos","Log Analytics Reader"],a:[0],e:"Sentinel Contributor permite criar e editar conteúdo (regras, workbooks, watchlists). Responder só gerencia incidentes; Owner é privilégio demais.",c:"Reader → Responder → Contributor: cada nível acrescenta permissões.",k:"Microsoft Sentinel Contributor permissões"},
{d:1,q:"Um analista precisa <b>criar e editar</b> playbooks do Sentinel. Qual função do Azure ele precisa no grupo de recursos dos playbooks?",o:["Logic App Contributor","Microsoft Sentinel Reader","Microsoft Sentinel Playbook Operator","Log Analytics Contributor"],a:[0],e:"Playbooks são Logic Apps; criá-los e editá-los exige Logic App Contributor. Playbook Operator só lista e executa playbooks manualmente.",c:"Executar playbook ≠ editar playbook: Playbook Operator executa; Logic App Contributor cria e edita.",k:"Microsoft Sentinel permissões playbooks Logic App Contributor"},
{d:1,q:"Analistas de nível 1 devem apenas <b>executar manualmente</b> playbooks aprovados sobre incidentes, sem poder editá-los. Qual função atribuir?",o:["Microsoft Sentinel Playbook Operator","Logic App Contributor","Microsoft Sentinel Automation Contributor","Owner"],a:[0],e:"Playbook Operator permite listar, ver e executar playbooks manualmente. Automation Contributor é para a conta de serviço do Sentinel, não para pessoas.",c:"Funções específicas de automação: Playbook Operator (pessoas) e Automation Contributor (serviço do Sentinel).",k:"Microsoft Sentinel Playbook Operator"},
{d:1,q:"A equipe de uma aplicação deve consultar no Sentinel apenas os logs das <b>próprias VMs</b>, sem acesso a todo o workspace. Qual abordagem usar?",o:["RBAC de contexto de recurso (resource-context RBAC)","Criar um segundo tenant","Atribuir Microsoft Sentinel Reader no workspace","Exportar os logs para uma conta de armazenamento"],a:[0],e:"Com o RBAC de contexto de recurso, quem tem acesso ao recurso do Azure vê os logs desse recurso, sem precisar de acesso ao workspace inteiro.",c:"Opções para restringir dados: RBAC de contexto de recurso, RBAC por tabela ou workspaces separados.",k:"Microsoft Sentinel RBAC contexto de recurso"},
{d:1,q:"Um usuário com Microsoft Sentinel Reader precisa <b>salvar</b> workbooks, sem ganhar outras permissões de edição. O que atribuir a mais?",o:["Workbook Contributor","Microsoft Sentinel Contributor","Logic App Contributor","Owner"],a:[0],e:"Reader + Workbook Contributor permite salvar workbooks mantendo o resto somente leitura.",c:"Permissões podem ser combinadas para chegar ao menor privilégio exato.",k:"Microsoft Sentinel salvar workbooks permissões"},

{d:2,q:"Você quer que uma consulta ASIM filtre os dados <b>já no parser</b>, para ter melhor desempenho. Qual tipo de parser usar?",o:["O parser unificador parametrizado <code>_Im_&lt;esquema&gt;</code>","O parser sem parâmetros <code>_ASim_&lt;esquema&gt;</code>","A função <code>externaldata</code>","Uma watchlist"],a:[0],e:"Os parsers _Im_ aceitam parâmetros de filtragem (por exemplo, intervalo de tempo e IPs), aplicados antes da normalização. Os _ASim_ não têm parâmetros.",c:"Use _Im_ em detecções e hunting por desempenho; _ASim_ para exploração interativa.",k:"ASIM parsers filtragem parâmetros"},
{d:2,q:"Um fornecedor de firewall que você usa não tem parser ASIM pronto. Como fazer com que as detecções ASIM existentes passem a considerar esses logs?",o:["Criar um parser específico da fonte e incluí-lo no parser unificador do esquema","Reescrever cada regra de detecção para ler a tabela do fornecedor","Converter os logs em watchlist","Não é possível usar ASIM com fontes sem suporte"],a:[0],e:"Parsers específicos da fonte transformam os dados para o esquema; ao adicioná-los ao parser unificador, todo o conteúdo ASIM passa a considerá-los automaticamente.",c:"ASIM: escreva o parser uma vez e reutilize todas as detecções normalizadas.",k:"ASIM desenvolver parser personalizado"},
{d:2,q:"Para normalizar logs de um <b>proxy web</b> com ASIM, qual esquema é o adequado?",o:["Web Session","DNS","Authentication","Process Event"],a:[0],e:"O esquema Web Session cobre requisições HTTP de proxies e gateways web. Network Session cobre conexões de rede em geral.",c:"Esquemas ASIM: Network Session, Web Session, DNS, Authentication, Process, File, Registry, Audit, User Management, DHCP, Alert.",k:"ASIM esquema Web Session"},

{d:3,q:"O SOC executa sempre a mesma sequência de prompts do Security Copilot para investigar e resumir incidentes de phishing. Como reaproveitar essa sequência?",o:["Criando um promptbook","Criando uma watchlist","Criando uma regra de automação","Salvando um bookmark"],a:[0],e:"Promptbooks são sequências de prompts reutilizáveis, que podem receber parâmetros (por exemplo, o ID do incidente).",c:"Promptbook = roteiro reutilizável no Security Copilot.",k:"Security Copilot promptbooks"},
{d:3,q:"Dentro de um incidente no portal do Defender, qual recurso do Security Copilot sugere ações de triagem, contenção e remediação para o analista?",o:["Guided response (resposta guiada)","Script analysis","Promptbook","Threat analytics"],a:[0],e:"A resposta guiada recomenda ações para o incidente (classificar, conter, remediar) com base nos alertas e entidades.",c:"Copilot no Defender: resumo do incidente, resposta guiada, análise de script e arquivo, geração de KQL e relatório do incidente.",k:"Security Copilot Defender resposta guiada"},
{d:4,q:"Um analista sem experiência em KQL precisa caçar ameaças no advanced hunting descrevendo o que procura em linguagem natural. O que usar?",o:["O assistente do Security Copilot para gerar consultas KQL no advanced hunting","Uma watchlist","Um workbook","O Secure Score"],a:[0],e:"O Copilot converte a pergunta em linguagem natural em uma consulta KQL, que o analista pode revisar e executar.",c:"A consulta gerada deve sempre ser revisada antes de virar detecção.",k:"Security Copilot gerar consultas KQL advanced hunting"},
{d:1,q:"Qual unidade é provisionada para dar capacidade de uso ao Microsoft Security Copilot?",o:["Security Compute Units (SCUs)","Commitment tier em GB por dia","Licenças E5 por usuário","Data Collection Endpoints"],a:[0],e:"A capacidade do Security Copilot é provisionada em SCUs; o uso consome essa capacidade.",c:"Sem capacidade provisionada (SCUs), o Copilot não processa prompts.",k:"Security Copilot Security Compute Units"},

{d:1,q:"Você precisa de <b>análise de caminho de ataque</b> e do <b>cloud security explorer</b> no Defender for Cloud. Qual plano habilitar?",o:["Defender CSPM","Foundational CSPM (gratuito)","Defender for Storage","Defender for DNS"],a:[0],e:"Attack path analysis e cloud security explorer fazem parte do plano pago Defender CSPM. O foundational CSPM traz recomendações e Secure Score.",c:"CSPM = postura (gratuito ou Defender CSPM); CWP = proteção de cargas (Servers, Storage, Databases, Containers…).",k:"Defender CSPM attack path analysis"},
{d:1,q:"Qual padrão de segurança vem atribuído por padrão no Defender for Cloud e serve de base para as recomendações e o Secure Score?",o:["Microsoft cloud security benchmark (MCSB)","PCI DSS","ISO 27001","NIST 800-53"],a:[0],e:"O MCSB é a iniciativa padrão. Outros padrões regulatórios podem ser adicionados ao painel de conformidade.",c:"Secure Score sobe ao corrigir as recomendações do MCSB.",k:"Microsoft cloud security benchmark Defender for Cloud"},
{d:1,q:"A auditoria exige acompanhar a conformidade com o PCI DSS nas assinaturas do Azure. O que fazer no Defender for Cloud?",o:["Adicionar o padrão PCI DSS em Regulatory compliance / Security policies","Criar uma watchlist com os controles do PCI","Habilitar o Defender for DNS","Criar uma regra de supressão"],a:[0],e:"Padrões regulatórios são adicionados às políticas de segurança e aparecem no painel de conformidade regulatória, controle a controle.",c:"Painel de conformidade = mapeamento das recomendações para controles de cada padrão.",k:"Defender for Cloud adicionar padrão de conformidade regulatória"},
{d:2,q:"As portas de RDP e SSH das VMs devem ficar fechadas e ser abertas apenas sob solicitação, por tempo limitado e para um IP específico. O que usar?",o:["Just-in-time (JIT) VM access","Adaptive application controls","File integrity monitoring","Defender for DNS"],a:[0],e:"O JIT (Defender for Servers Plano 2) bloqueia as portas de gerenciamento no NSG/firewall e as abre por tempo limitado quando aprovado.",c:"JIT reduz a superfície de ataque das portas de gerenciamento.",k:"Defender for Cloud just-in-time VM access"},
{d:2,q:"Você precisa detectar alterações em arquivos críticos do sistema operacional e em chaves de registro dos servidores. O que habilitar?",o:["File integrity monitoring (FIM) do Defender for Servers","Safe Attachments","Regras ASR","Defender for Storage"],a:[0],e:"O FIM, incluído no Defender for Servers Plano 2, monitora alterações em arquivos, registro e softwares.",c:"Alterações inesperadas em arquivos de sistema podem indicar comprometimento.",k:"Defender for Cloud file integrity monitoring"},
{d:2,q:"Arquivos enviados a um Blob Storage por clientes devem ser verificados contra malware assim que são carregados. O que habilitar?",o:["Malware scanning do Defender for Storage","Defender for Key Vault","Defender for Resource Manager","Safe Links"],a:[0],e:"O Defender for Storage pode verificar blobs no upload e gerar alertas, com opção de automação para mover ou excluir o arquivo infectado.",c:"Defender for Storage: atividade suspeita + verificação de malware no upload.",k:"Defender for Storage malware scanning"},
{d:2,q:"Você quer ser alertado sobre operações de gerenciamento suspeitas na assinatura, como a execução de comandos em massa nas VMs pelo plano de controle do Azure. Qual plano habilitar?",o:["Defender for Resource Manager","Defender for App Service","Defender for Storage","Defender CSPM"],a:[0],e:"O Defender for Resource Manager monitora as operações do ARM (portal, CLI, APIs) e detecta atividades suspeitas no plano de controle.",c:"Plano de controle (ARM) ≠ plano de dados (dentro da VM ou do serviço).",k:"Defender for Resource Manager alertas"},
{d:2,q:"Você precisa de proteção em tempo de execução e avaliação de vulnerabilidades para clusters Kubernetes (AKS e EKS). Qual plano habilitar?",o:["Defender for Containers","Defender for Servers","Defender for App Service","Defender for DNS"],a:[0],e:"O Defender for Containers cobre endurecimento, avaliação de vulnerabilidades de imagens e detecção de ameaças em tempo de execução em clusters de várias nuvens.",c:"Cada tipo de carga de trabalho tem seu plano no Defender for Cloud.",k:"Defender for Containers"},
{d:1,q:"Os alertas e recomendações do Defender for Cloud precisam ser enviados continuamente a um SIEM de terceiros via Event Hubs. O que configurar?",o:["Continuous export","Workflow automation","Regras de supressão","Regulatory compliance"],a:[0],e:"Continuous export envia alertas, recomendações e Secure Score para Event Hubs ou Log Analytics. Workflow automation dispara Logic Apps.",c:"Exportar dados → continuous export. Reagir a eventos → workflow automation.",k:"Defender for Cloud continuous export Event Hubs"},
{d:1,q:"Servidores físicos do datacenter local devem ser protegidos pelo Defender for Servers. Qual é o pré-requisito para que apareçam no Defender for Cloud?",o:["Integrá-los ao Azure Arc","Migrá-los para o Azure","Instalar o sensor do Defender for Identity","Criar um conector do Office 365"],a:[0],e:"O Azure Arc projeta máquinas fora do Azure como recursos do Azure, permitindo aplicar planos e políticas do Defender for Cloud.",c:"Híbrido e multicloud: Arc para servidores; conectores para AWS e GCP.",k:"Defender for Servers Azure Arc servidores locais"},
{d:1,q:"Você quer avaliar vulnerabilidades das VMs <b>sem instalar agentes</b>, analisando snapshots de disco. Qual recurso usar?",o:["Agentless machine scanning","Log Analytics agent","Live response","Device discovery"],a:[0],e:"O agentless scanning (Defender CSPM ou Defender for Servers Plano 2) analisa snapshots de disco para inventário de software, vulnerabilidades e segredos.",c:"Agentless complementa o sensor do MDE e cobre máquinas onde não há agente.",k:"Defender for Cloud agentless machine scanning"},
{d:1,q:"Para cada afirmação sobre o Microsoft Defender for Cloud, selecione Sim se for verdadeira ou Não se for falsa.",t:"yn",s:["O foundational CSPM é gratuito e inclui recomendações e Secure Score.","Workflow automation dispara Logic Apps a partir de alertas ou recomendações.","Para proteger VMs da AWS é obrigatório migrá-las para o Azure."],a:[true,true,false],e:"O CSPM básico é gratuito. Workflow automation usa Logic Apps. AWS e GCP são conectados por conectores multicloud, sem migração.",c:"Defender for Cloud é multicloud e híbrido.",k:"Defender for Cloud visão geral"},

{d:1,q:"Os eventos de segurança de um servidor geram muito volume, e uma coluna verbosa deve ser removida <b>antes</b> de ser gravada no workspace, para reduzir custos. O que usar?",o:["Uma transformação na Data Collection Rule (transformKql)","Uma regra de automação","Um workbook","Uma regra de supressão do Defender for Cloud"],a:[0],e:"Transformações no momento da ingestão (KQL na DCR) filtram linhas ou removem colunas antes do armazenamento, reduzindo custo.",c:"Transformação de ingestão = filtrar e moldar dados antes de pagar por eles.",k:"Data Collection Rule transformação ingestão"},
{d:1,q:"Uma aplicação interna precisa enviar eventos personalizados para o Sentinel por meio de uma API REST. Qual abordagem usar?",o:["Logs Ingestion API, com DCR (e DCE, quando necessário) e uma tabela personalizada","Uma watchlist atualizada manualmente","O conector Syslog","O conector Office 365"],a:[0],e:"A Logs Ingestion API recebe dados via REST e usa uma DCR para transformar e direcionar os dados a uma tabela _CL.",c:"A API antiga (HTTP Data Collector) está sendo substituída pela Logs Ingestion API.",k:"Logs Ingestion API Azure Monitor"},
{d:1,q:"Uma aplicação grava logs em arquivos de texto em VMs Windows. Como coletá-los para o Sentinel?",o:["Usar Custom Logs via AMA (DCR para logs de texto) gravando em uma tabela _CL","Usar o conector Windows Security Events","Criar uma watchlist","Usar o conector Azure Activity"],a:[0],e:"O AMA coleta arquivos de texto por uma DCR específica, enviando-os para uma tabela personalizada.",c:"Tabelas personalizadas terminam com _CL.",k:"Custom logs via AMA Sentinel"},
{d:1,q:"Você vai conectar os logs de entrada (SigninLogs) do Microsoft Entra ID ao Sentinel. Qual licença do Entra ID é necessária?",o:["Microsoft Entra ID P1 ou P2","Nenhuma, funciona com a edição gratuita","Microsoft Defender for Endpoint P2","Microsoft Purview"],a:[0],e:"Os logs de entrada exigem Entra ID P1 ou P2. Os logs de auditoria podem ser coletados com a edição gratuita.",c:"Conector do Entra ID: SigninLogs, AuditLogs e outras categorias, com diagnóstico enviado ao workspace.",k:"Microsoft Sentinel conector Entra ID licença"},
{d:1,q:"Qual tabela recebe as atividades do Exchange Online, do SharePoint Online e do Teams quando você habilita o conector do Microsoft 365 (Office 365) no Sentinel?",o:["<code>OfficeActivity</code>","<code>AuditLogs</code>","<code>CloudAppEvents</code>","<code>EmailEvents</code>"],a:[0],e:"O conector do Office 365 grava em OfficeActivity. AuditLogs é do Entra ID; CloudAppEvents e EmailEvents vêm do Defender XDR.",c:"Saber de onde vem cada tabela é essencial no SC-200.",k:"Sentinel conector Office 365 OfficeActivity"},
{d:1,q:"Você quer consultar <code>DeviceProcessEvents</code> no Sentinel com retenção maior que a do Defender XDR. O que configurar no conector do Defender XDR?",o:["Habilitar a coleta de eventos (tabelas de advanced hunting) no conector","Habilitar apenas a sincronização de incidentes","Instalar o AMA em todos os endpoints","Criar uma watchlist de dispositivos"],a:[0],e:"Além dos incidentes, o conector do Defender XDR pode transmitir os eventos brutos de advanced hunting para o workspace, onde a retenção é configurável.",c:"Advanced hunting do XDR guarda 30 dias; o workspace pode guardar muito mais.",k:"conector Defender XDR coletar eventos"},
{d:1,q:"Você precisa habilitar o conector Azure Activity para <b>todas</b> as assinaturas atuais e futuras. Qual é o método recomendado?",o:["Atribuir a Azure Policy que configura as configurações de diagnóstico","Configurar manualmente cada assinatura todo mês","Instalar o AMA em cada VM","Criar uma regra NRT"],a:[0],e:"O conector usa uma atribuição de Azure Policy que cria as configurações de diagnóstico, inclusive com tarefa de correção para recursos existentes.",c:"Azure Policy garante a configuração de forma consistente e em escala.",k:"Sentinel conector Azure Activity Azure Policy"},
{d:1,q:"Um fornecedor quer publicar um conector para o Sentinel que coleta dados de uma API REST, sem escrever código de Azure Functions. Qual plataforma usar?",o:["Codeless Connector Platform (CCP)","Logic Apps Standard","Notebooks","Search jobs"],a:[0],e:"O CCP permite criar conectores declarativos (de polling ou push) sem código, gerenciados pelo próprio Sentinel.",c:"Conectores no Sentinel: nativos, via agente (AMA), via API (CCP/Functions) e via Logs Ingestion API.",k:"Microsoft Sentinel Codeless Connector Platform"},

{d:3,q:"Durante a investigação, você quer executar um playbook sobre um <b>endereço IP específico</b> diretamente na entidade, sem rodar no incidente inteiro. Qual gatilho o playbook precisa ter?",o:["Gatilho de entidade (entity trigger)","Gatilho de incidente","Gatilho de alerta","Gatilho de recorrência"],a:[0],e:"Playbooks com gatilho de entidade podem ser executados sobre uma entidade (IP, conta, host, URL) a partir do incidente ou do hunting.",c:"Gatilhos de playbook do Sentinel: incidente, alerta e entidade.",k:"Microsoft Sentinel playbook gatilho de entidade"},
{d:3,q:"Qual é a forma recomendada para um playbook se autenticar no Microsoft Sentinel e em outros serviços do Azure?",o:["Identidade gerenciada (managed identity) do Logic App","Conta de usuário pessoal do analista","Chave de conta de armazenamento no código","Senha do administrador global"],a:[0],e:"A identidade gerenciada evita segredos no código; basta conceder a ela as funções necessárias (por exemplo, Microsoft Sentinel Responder).",c:"Sem segredos embutidos: identidades gerenciadas e menor privilégio.",k:"Microsoft Sentinel playbook identidade gerenciada"},
{d:3,q:"Duas regras de automação do Sentinel atuam no mesmo incidente. O que define qual delas é executada primeiro?",o:["O número de ordem (Order) — o menor executa primeiro","A data de criação — a mais nova primeiro","A severidade do incidente","A ordem alfabética do nome"],a:[0],e:"Regras de automação são processadas pela ordem configurada; com o mesmo número, o critério de desempate é a data de criação.",c:"Planeje a ordem: atribuir e classificar antes de disparar notificações.",k:"Microsoft Sentinel regras de automação ordem"},
{d:3,q:"Um pentest autorizado vai gerar incidentes durante uma semana. Você quer fechá-los automaticamente só nesse período. O que configurar?",o:["Uma regra de automação que fecha os incidentes correspondentes, com data de expiração","Desativar todas as regras de análise","Excluir o workspace","Uma watchlist sem regra associada"],a:[0],e:"Regras de automação aceitam condições (por exemplo, IPs do pentest) e data de expiração, desligando-se sozinhas.",c:"Supressão temporária e controlada, sem desligar as detecções.",k:"Microsoft Sentinel regra de automação expiração"},
{d:3,q:"Você quer que uma regra de automação seja executada de novo quando a severidade de um incidente existente for alterada. Qual gatilho usar?",o:["When incident is updated (quando o incidente é atualizado)","When incident is created","When alert is created","Agendamento de recorrência"],a:[0],e:"O gatilho de atualização permite condições sobre mudanças (status, severidade, dono, tags, novos alertas).",c:"Gatilhos de regras de automação: incidente criado, incidente atualizado, alerta criado.",k:"Microsoft Sentinel regra de automação incidente atualizado"},

{d:1,q:"Os usuários de um workbook devem poder escolher o intervalo de tempo exibido em todos os gráficos. O que adicionar?",o:["Um parâmetro de intervalo de tempo (time range parameter)","Uma regra NRT","Uma watchlist","Um bookmark"],a:[0],e:"Parâmetros de workbook (tempo, listas suspensas, texto) são referenciados nas consultas e tornam o painel interativo.",c:"Workbook = consultas + visualizações + parâmetros.",k:"Azure Monitor workbooks parâmetros"},
{d:1,q:"Você instalou um modelo de workbook pelo Content hub e quer personalizá-lo. Qual é o procedimento correto?",o:["Salvar o modelo como um workbook próprio e editar a cópia","Editar o modelo diretamente","Exportar como playbook","Converter em regra de análise"],a:[0],e:"Modelos não são editados diretamente: você salva uma cópia (\"Save\"), que passa a aparecer em My workbooks, e edita essa cópia.",c:"Modelos são atualizados pelo fornecedor; suas cópias são suas.",k:"Microsoft Sentinel workbooks modelos salvar"},

{d:3,q:"Você precisa descobrir qual usuário excluiu um arquivo de um site do SharePoint Online na semana passada. Onde pesquisar?",o:["Na pesquisa de auditoria do Microsoft Purview","No Threat Explorer","No Secure Score","No inventário de dispositivos"],a:[0],e:"A auditoria do Purview registra atividades de usuários e administradores no Microsoft 365, incluindo exclusões de arquivos no SharePoint.",c:"Audit = trilha de quem fez o quê no Microsoft 365.",k:"Microsoft Purview pesquisa de auditoria"},
{d:2,q:"Você quer detectar funcionários que estão saindo da empresa e copiando dados confidenciais. Qual solução do Purview usar?",o:["Insider Risk Management com a política de roubo de dados por usuários que estão saindo","Safe Attachments","Defender for Identity","Regras ASR"],a:[0],e:"O Insider Risk Management correlaciona sinais (por exemplo, data de desligamento via conector de RH) com atividades de exfiltração.",c:"Ameaças internas: Insider Risk Management; vazamento por política: DLP.",k:"Purview Insider Risk Management roubo de dados"},
{d:2,q:"Você quer impedir que usuários copiem arquivos com números de cartão de crédito para pendrives nos computadores Windows. O que configurar?",o:["Uma política de DLP de endpoint do Purview, com dispositivos integrados","Uma regra de supressão","Um indicador de URL","Uma watchlist"],a:[0],e:"O Endpoint DLP controla ações (copiar para USB, imprimir, enviar a nuvem) em dispositivos integrados ao Purview, o que pode ser feito pelo Defender for Endpoint.",c:"DLP de endpoint usa a mesma integração do MDE.",k:"Purview Endpoint DLP USB"},

{d:2,q:"Você quer bloquear o acesso a sites de categorias como jogos de azar em todos os dispositivos com Defender for Endpoint. O que configurar?",o:["Web content filtering","Indicador de arquivo","Regra ASR","Tamper protection"],a:[0],e:"O web content filtering bloqueia categorias de sites e depende da Network Protection nos navegadores de terceiros.",c:"Categoria de site → content filtering; site específico → indicador de URL.",k:"Defender for Endpoint web content filtering"},
{d:3,q:"Uma remediação automática colocou em quarentena um arquivo que era legítimo. Onde desfazer a ação?",o:["No histórico do Action center","No Secure Score","No Content hub","Na watchlist"],a:[0],e:"Ações concluídas aparecem no histórico do Action center, onde podem ser desfeitas.",c:"Action center: Pending (aprovar) e History (consultar e desfazer).",k:"Defender XDR Action center desfazer ação"},
{d:3,q:"Você quer executar no live response um script PowerShell <b>não assinado</b> da biblioteca. O que precisa estar habilitado?",o:["A configuração avançada que permite a execução de scripts não assinados no live response","Tamper protection","Network protection","Restrict app execution"],a:[0],e:"Por padrão, o live response só executa scripts assinados; a execução de não assinados precisa ser habilitada nos recursos avançados.",c:"Recursos avançados do MDE controlam o que o live response pode fazer.",k:"Defender for Endpoint live response scripts não assinados"},
{d:3,q:"O que você deve habilitar para usar o live response em dispositivos Windows Server?",o:["O recurso avançado Live Response for Servers","Defender for Identity","O conector Azure Activity","Safe Links"],a:[0],e:"Além do live response geral, servidores exigem o recurso avançado específico \"Live Response for Servers\".",c:"Servidores têm configurações separadas por segurança.",k:"Defender for Endpoint live response servidores"},
{d:3,q:"Você quer executar um arquivo suspeito em um ambiente controlado na nuvem para obter um relatório detalhado de comportamento. Qual ação usar?",o:["Deep analysis (análise profunda)","Collect investigation package","Isolate device","Add indicator — Allow"],a:[0],e:"A deep analysis envia o arquivo para um sandbox e retorna atividades observadas, como conexões e arquivos criados.",c:"Sandbox no MDE = deep analysis; no MDO = Safe Attachments.",k:"Defender for Endpoint deep analysis"},
{d:2,q:"Uma empresa usa um antivírus de terceiros como principal, com o Defender Antivirus em modo passivo. Como fazer com que o EDR do Defender ainda bloqueie artefatos maliciosos detectados?",o:["Habilitar o EDR in block mode","Desinstalar o antivírus de terceiros","Habilitar Safe Attachments","Criar uma watchlist"],a:[0],e:"O EDR in block mode permite que o Defender corrija artefatos detectados pelo EDR mesmo com o antivírus em modo passivo.",c:"Defesa em profundidade quando o Defender não é o antivírus principal.",k:"Defender for Endpoint EDR in block mode"},
{d:2,q:"Você quer impedir que um ransomware altere arquivos nas pastas Documentos e Área de Trabalho, permitindo apenas aplicativos confiáveis. O que habilitar?",o:["Controlled folder access","Device discovery","Live response","Custom detections"],a:[0],e:"O acesso controlado a pastas bloqueia alterações em pastas protegidas por aplicativos não confiáveis.",c:"Proteções do Defender: ASR, network protection, controlled folder access, tamper protection.",k:"Defender controlled folder access"},

{d:4,q:"Você quer obter o <b>registro mais recente</b> de cada dispositivo na tabela <code>DeviceInfo</code>. Qual função de agregação usar?",o:["<code>summarize arg_max(Timestamp, *) by DeviceId</code>","<code>summarize count() by DeviceId</code>","<code>summarize make_set(DeviceName)</code>","<code>top 1 by Timestamp</code>"],a:[0],e:"arg_max retorna a linha inteira em que Timestamp é máximo para cada DeviceId. top 1 traria apenas uma linha no total.",c:"arg_max/arg_min = linha mais recente/mais antiga por chave.",k:"KQL arg_max"},
{d:4,q:"Qual operador de string tem <b>melhor desempenho</b> ao procurar um termo inteiro, como um nome de processo, porque usa o índice de termos?",o:["<code>has</code>","<code>contains</code>","<code>matches regex</code>","<code>startswith</code> em qualquer posição"],a:[0],e:"has procura termos indexados e é mais rápido. contains procura substrings em qualquer parte e é mais lento; regex é o mais custoso.",c:"Prefira has/has_any para termos inteiros; use contains só quando precisar de substring.",k:"KQL has vs contains desempenho"},
{d:4,q:"Uma coluna contém um array dinâmico de IPs, e você precisa de uma linha por IP. Qual operador usar?",o:["<code>mv-expand</code>","<code>summarize</code>","<code>project-away</code>","<code>distinct</code>"],a:[0],e:"mv-expand expande arrays ou property bags em várias linhas, uma para cada elemento.",c:"mv-expand (array → linhas) e make_list/make_set (linhas → array) são opostos.",k:"KQL mv-expand"},
{d:4,q:"Você quer contar logins com falha em intervalos de 1 hora para desenhar um gráfico. Qual função agrupa o tempo nesses intervalos?",o:["<code>bin(TimeGenerated, 1h)</code>","<code>ago(1h)</code>","<code>now(1h)</code>","<code>datetime_diff()</code>"],a:[0],e:"bin() arredonda valores para baixo no tamanho do intervalo, criando os grupos usados em summarize ... by bin(...).",c:"Padrão: summarize count() by bin(TimeGenerated, 1h) | render timechart.",k:"KQL bin função"},
{d:4,q:"Você quer reutilizar uma lista de IPs suspeitos em várias partes da mesma consulta KQL. O que usar?",o:["Uma instrução <code>let</code>","O operador <code>render</code>","A função <code>bin()</code>","O operador <code>take</code>"],a:[0],e:"let define variáveis, tabelas temporárias ou funções reutilizáveis dentro da consulta.",c:"let deixa consultas longas mais legíveis e fáceis de manter.",k:"KQL instrução let"},
{d:4,q:"No advanced hunting do Defender XDR, você quer enriquecer hashes de arquivos com informações como prevalência global e assinante. Qual função usar?",o:["<code>invoke FileProfile()</code>","<code>parse_json()</code>","<code>_GetWatchlist()</code>","<code>geo_info_from_ip_address()</code>"],a:[0],e:"FileProfile() acrescenta informações sobre o arquivo, como prevalência, assinatura e reputação.",c:"Funções do advanced hunting: FileProfile(), DeviceFromIP(), AssignedIPAddresses().",k:"advanced hunting FileProfile"},
{d:4,q:"Por quanto tempo os dados ficam disponíveis para consulta no advanced hunting do Microsoft Defender XDR (sem streaming para um workspace)?",o:["30 dias","7 dias","180 dias","2 anos"],a:[0],e:"O advanced hunting guarda até 30 dias de dados brutos. Para mais tempo, transmita os eventos para o Sentinel ou outro destino.",c:"Retenção longa → Sentinel (workspace), com camadas de longo prazo.",k:"advanced hunting retenção de dados"},
{d:4,q:"Para cada afirmação sobre KQL, selecione Sim se for verdadeira ou Não se for falsa.",t:"yn",s:["O operador <code>where</code> deve aparecer o mais cedo possível para melhorar o desempenho.","<code>union</code> combina tabelas por uma coluna em comum, como um join.","<code>project</code> escolhe e renomeia as colunas do resultado."],a:[true,false,true],e:"Filtrar cedo reduz o volume processado. union empilha linhas de tabelas; quem combina por chave é join. project seleciona e renomeia colunas.",c:"Ordem eficiente: filtrar no tempo → filtrar condições → projetar → agregar.",k:"KQL boas práticas de desempenho"},
